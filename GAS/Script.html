<script>
function switchTab(name){
  if(name==='ai'&&isDirty()){confirmLeave(function(){switchTab(name);});return;}
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===name);});
  document.getElementById('view-report').style.display=name==='report'?'block':'none';
  document.getElementById('view-ai').style.display=name==='ai'?'block':'none';
  if(name==='ai')refreshAISetupBanner();
}

// ===== LEAVE CONFIRMATION =====
var _leaveAfter=null;
function confirmLeave(afterFn){
  _leaveAfter=afterFn;
  document.getElementById('leave-confirm-modal').style.display='flex';
}
function leaveConfirm(action){
  var modal=document.getElementById('leave-confirm-modal');modal.style.display='none';
  if(action==='cancel'){_leaveAfter=null;return;}
  if(action==='discard'){_presetSnapshot=null;refreshDirtyUI();if(_leaveAfter){var fn=_leaveAfter;_leaveAfter=null;fn();}return;}
  if(action==='save'){
    if(!_activePresetId){
      // No preset to save to — open the editor instead
      _leaveAfter=null;openPresetEditor(null);return;
    }
    var pending=_leaveAfter;_leaveAfter=null;
    var p=presets.find(function(x){return x.id===_activePresetId;});if(!p){if(pending)pending();return;}
    var payload={id:p.id,name:p.name,icon:p.icon||'',description:p.description||'',filters:collectConditionsSafe(),enhanced:!!p.enhanced,funnelStages:p.funnelStages||null,columns:p.columns||null};
    google.script.run.withSuccessHandler(function(r){
      if(r&&r.error){showError(r.error);return;}
      snapshotFilters();refreshPresetsFromDB();
      if(pending)pending();
    }).saveCustomPreset(payload);
  }
}
window.addEventListener('beforeunload',function(ev){
  if(isDirty()){ev.preventDefault();ev.returnValue='';return '';}
});

// ===== AI KEY SETUP =====
function refreshAISetupBanner(){
  google.script.run.withSuccessHandler(function(configured){
    var b=document.getElementById('ai-setup-banner');
    if(configured){b.style.display='none';b.innerHTML='';return;}
    b.style.display='block';
    b.innerHTML='<div style="background:var(--warning-light);border-left:3px solid var(--warning);padding:12px 14px;border-radius:6px;font-size:13px;margin-bottom:14px;color:#92400e"><strong>API-ключ не налаштовано.</strong> Натисніть «Налаштувати API-ключ» угорі праворуч, щоб увімкнути AI-помічника.</div>';
  }).isAIConfigured();
}
function openAIKeyModal(){
  document.getElementById('ai-key-input').value='';
  document.getElementById('ai-key-error').textContent='';
  document.getElementById('ai-key-modal').style.display='flex';
  setTimeout(function(){document.getElementById('ai-key-input').focus();},50);
}
function saveAIKey(){
  var inp=document.getElementById('ai-key-input');var err=document.getElementById('ai-key-error');
  var btn=document.getElementById('ai-key-save-btn');
  var key=(inp.value||'').trim();err.textContent='';
  if(!key){err.textContent='Введіть ключ';return;}
  if(key.indexOf('sk-ant-')!==0){err.textContent='Ключ має починатися з sk-ant-';return;}
  btn.disabled=true;btn.innerHTML='<span class="ai-spinner"></span>Збереження...';
  google.script.run.withSuccessHandler(function(r){
    btn.disabled=false;btn.textContent='Зберегти';
    if(r&&r.error){err.textContent=r.error;return;}
    document.getElementById('ai-key-modal').style.display='none';
    refreshAISetupBanner();
    addAIMessage('ai','Система','API-ключ збережено. Можна робити запити.');
  }).withFailureHandler(function(e){
    btn.disabled=false;btn.textContent='Зберегти';err.textContent=e.message||String(e);
  }).setAnthropicKey(key);
}

// ===== AI ASSISTANT =====
function addAIMessage(kind,label,html){
  var hist=document.getElementById('ai-history');hist.classList.add('has-content');
  var msg=document.createElement('div');msg.className='ai-msg '+kind;
  msg.innerHTML='<div class="label">'+esc(label)+'</div>'+html;
  hist.appendChild(msg);hist.scrollTop=hist.scrollHeight;
}
function sendAiPrompt(){
  var ta=document.getElementById('ai-prompt');var text=(ta.value||'').trim();
  if(!text)return;
  var btn=document.getElementById('ai-send-btn');btn.disabled=true;btn.innerHTML='<span class="ai-spinner"></span>Думаю...';
  addAIMessage('user','Ви',esc(text));
  ta.value='';
  google.script.run.withSuccessHandler(function(r){
    btn.disabled=false;btn.textContent='Згенерувати звіт';
    if(r.error){addAIMessage('error','Помилка',esc(r.error)+(r.raw?'<pre>'+esc(r.raw)+'</pre>':''));return;}
    handleAIResult(r.result);
  }).withFailureHandler(function(e){
    btn.disabled=false;btn.textContent='Згенерувати звіт';
    addAIMessage('error','Помилка',esc(e.message||String(e)));
  }).askAI(text);
}
function handleAIResult(result){
  var chips=(result.filters||[]).map(function(f){
    var fld=fields.find(function(x){return x.field_id===f.field_id;});
    var name=fld?fld.label:'field '+f.field_id;
    var v=Array.isArray(f.value)?f.value.join(','):f.value;
    return '<span class="filter-chip">'+esc(name)+' '+esc(f.operator)+' '+esc(String(v))+'</span>';
  }).join('');
  var body=(result.explanation?'<div>'+esc(result.explanation)+'</div>':'')+'<div style="margin-top:8px">'+chips+'</div>';
  addAIMessage('ai','AI',body);
  applyAIFilters(result.filters||[]);
  setTimeout(function(){switchTab('report');runReport();},250);
}
var _recognizer=null,_listening=false;
function toggleMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var btn=document.getElementById('ai-mic-btn');
  if(!SR){addAIMessage('error','Голос','Браузер не підтримує розпізнавання. Потрібен Chrome або Edge.');return;}
  if(_listening){try{_recognizer.stop();}catch(e){}return;}
  var rec=new SR();rec.lang='uk-UA';rec.interimResults=true;rec.continuous=false;
  var ta=document.getElementById('ai-prompt');
  var base=ta.value?ta.value+' ':'';
  rec.onstart=function(){_listening=true;btn.classList.add('listening');};
  rec.onresult=function(ev){
    var txt='';for(var i=ev.resultIndex;i<ev.results.length;i++)txt+=ev.results[i][0].transcript;
    ta.value=base+txt;
  };
  rec.onerror=function(ev){
    _listening=false;btn.classList.remove('listening');
    if(ev.error==='no-speech'||ev.error==='aborted')return;
    if(ev.error==='not-allowed'){
      addAIMessage('error','Голос','Мікрофон заблоковано. Apps Script обгортає сторінку в iframe без дозволу на мікрофон. Відкрийте додаток у новій вкладці (посилання Open in new tab / ↗ у правому верхньому куті) та дайте дозвіл у браузері.');
      return;
    }
    addAIMessage('error','Голос','Помилка мікрофона: '+ev.error);
  };
  rec.onend=function(){_listening=false;btn.classList.remove('listening');};
  _recognizer=rec;rec.start();
}

function applyAIFilters(filters){
  // Drop any active preset, wipe the filter rows, then recreate from the AI list
  _activePresetId=null;
  document.querySelectorAll('.preset-card').forEach(function(c){c.classList.remove('active');});
  window._presetColumns=null;window._presetSheetFilters=null;window._presetOrConditions=[];
  document.getElementById('filter-rows').innerHTML='';

  // Group IN operator values into a single multi-select row per field
  var byFieldIn={};var others=[];
  filters.forEach(function(f){
    if(f.operator==='IN'&&Array.isArray(f.value)){
      if(!byFieldIn[f.field_id])byFieldIn[f.field_id]={field_id:f.field_id,operator:'IN',value:[]};
      byFieldIn[f.field_id].value=byFieldIn[f.field_id].value.concat(f.value);
    }else{
      others.push(f);
    }
  });
  Object.keys(byFieldIn).forEach(function(fid){addFilterRowWithData(byFieldIn[fid]);});
  others.forEach(function(f){addFilterRowWithData(f);});
  if(!filters.length)addFilterRow();
}
var fields=[],pipelines=[],users=[],stages={},opLabels={},presets=[],lastData=null,sortCol=null,sortDir='asc';
var productNames=[];
window._presetOrConditions=[];window._presetColumns=null;

// Унифицированная палитра и базовые опции графиков
var CHART_COLORS={primary:'#3b82f6',success:'#10b981',danger:'#ef4444',warning:'#f59e0b',purple:'#8b5cf6',teal:'#14b8a6',orange:'#f97316',gray:'#6b7280'};
var CHART_BASE={
  backgroundColor:{fill:'transparent'},
  fontName:'-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif',
  legend:{position:'top',alignment:'start',textStyle:{fontSize:12,color:'#4b5563'}},
  tooltip:{textStyle:{fontSize:12}},
  hAxis:{textStyle:{fontSize:11,color:'#6b7280'},gridlines:{color:'transparent'}},
  vAxis:{textStyle:{fontSize:11,color:'#9ca3af'},gridlines:{color:'#f3f4f6'},minorGridlines:{color:'transparent'},baselineColor:'#e5e7eb'},
  chartArea:{left:48,right:24,top:40,bottom:56}
};
function chartOpts(extra){var o=JSON.parse(JSON.stringify(CHART_BASE));Object.keys(extra||{}).forEach(function(k){o[k]=extra[k];});return o;}

google.charts.load('current',{packages:['corechart','bar']});

document.addEventListener('DOMContentLoaded',function(){
  google.script.run.withSuccessHandler(function(f){fields=f;addFilterRow();installFilterObserver();}).getFieldsConfig();
  google.script.run.withSuccessHandler(function(p){pipelines=p;}).getPipelinesConfig();
  google.script.run.withSuccessHandler(function(u){users=u;}).getUsersConfig();
  google.script.run.withSuccessHandler(function(s){stages=s;}).getAllStages();
  google.script.run.withSuccessHandler(function(o){opLabels=o;}).getOperatorsLabels();
  google.script.run.withSuccessHandler(function(p){presets=p;initPresets();refreshPresetsFromDB();}).getPresetReports();
  google.script.run.withSuccessHandler(function(p){productNames=p||[];}).getProductNames();
  // Override hardcoded data with real values from DB
  google.script.run.withSuccessHandler(function(u){if(u&&u.length)users=u.map(function(r){return {id:r.id,name:r.name,active:r.active};});}).getUsersFromDB();
  google.script.run.withSuccessHandler(function(p){if(p&&p.length)pipelines=p;}).getPipelinesFromDB();
  google.script.run.withSuccessHandler(function(s){if(s&&Object.keys(s).length)stages=s;}).getStagesFromDB();
  google.script.run.withSuccessHandler(function(m){
    // Override field options with real DB values
    if(!m||!Object.keys(m).length)return;
    fields.forEach(function(f){if(m[f.field_id])f.options=m[f.field_id];});
  }).getFieldOptionsFromDB();
  var y=new Date().getFullYear();
  document.getElementById('date-from').value=y+'-01-01';
  document.getElementById('date-to').value=y+'-12-31';
});

// ===== SYNC MODAL =====
function refreshData(){
  var df=document.getElementById('date-from').value;
  var dt=document.getElementById('date-to').value;
  if(!df||!dt){showError('Оберіть період');return;}
  document.getElementById('sync-modal').style.display='flex';
  document.getElementById('sync-progress').style.display='block';
  document.getElementById('sync-result').style.display='none';
  google.script.run.withSuccessHandler(function(r){
    document.getElementById('sync-progress').style.display='none';
    document.getElementById('sync-result').style.display='block';
    if(r.error){
      document.getElementById('sync-result-icon').className='state-badge error';
      document.getElementById('sync-result-icon').textContent='Error';
      document.getElementById('sync-result-title').textContent='Помилка синхронізації';
      document.getElementById('sync-result-table').innerHTML='<p style="color:var(--danger)">'+esc(r.error)+'</p>';
      return;
    }
    var results=r.results||[];
    var totalAll=results.reduce(function(s,x){return s+x.inserted;},0);
    var errAll=results.reduce(function(s,x){return s+x.errors;},0);
    var elapsed=results.reduce(function(s,x){return s+(x.elapsed||0);},0);
    var badge=document.getElementById('sync-result-icon');
    badge.className='state-badge '+(errAll>0?'warning':'success');
    badge.textContent=errAll>0?'Warn':'OK';
    document.getElementById('sync-result-title').textContent=totalAll.toLocaleString('uk-UA')+' записів синхронізовано';
    var html='<table><tr><th>Сутність</th><th>Записів</th><th>Успіх</th></tr>';
    results.forEach(function(res){
      var pct=res.total>0?(res.inserted/res.total*100).toFixed(res.errors>0?2:0)+'%':'—';
      var cls=res.errors>0?'error':'success';
      var cnt=res.errors>0?res.inserted+'/'+res.total:res.total.toLocaleString('uk-UA');
      html+='<tr><td>'+res.entity+'</td><td>'+cnt+'</td><td class="'+cls+'">'+pct+'</td></tr>';
    });
    html+='</table>';
    document.getElementById('sync-result-table').innerHTML=html;
    document.getElementById('sync-result-time').textContent='Час: '+Math.floor(elapsed/60)+'хв '+elapsed%60+'с';
  }).withFailureHandler(function(e){
    document.getElementById('sync-progress').style.display='none';
    document.getElementById('sync-result').style.display='block';
    document.getElementById('sync-result-icon').className='state-badge error';
    document.getElementById('sync-result-icon').textContent='Error';
    document.getElementById('sync-result-title').textContent='Помилка';
    document.getElementById('sync-result-table').innerHTML='<p>'+esc(e.message||String(e))+'</p>';
  }).refreshAllData(df,dt);
}
function closeSyncModal(){document.getElementById('sync-modal').style.display='none';}

// ===== PRESETS =====
var _activePresetId=null;

function refreshPresetsFromDB(){
  google.script.run.withSuccessHandler(function(list){
    if(!list||!list.length)return;
    // Merge: DB is source of truth for shared attributes; local defs keep
    // any legacy helpers that the editor did not include.
    var byId={};presets.forEach(function(p){byId[p.id]=p;});
    list.forEach(function(p){
      var base=byId[p.id]||{};
      byId[p.id]=Object.assign({},base,{
        id:p.id,name:p.name,icon:p.icon||base.icon||'',description:p.description||'',
        enhanced:!!p.enhanced,funnelStages:p.funnelStages||base.funnelStages||null,
        andConditions:p.andConditions&&p.andConditions.length?p.andConditions:(base.andConditions||[]),
        orConditions:p.orConditions&&p.orConditions.length?p.orConditions:(base.orConditions||[]),
        sheetFilters:p.sheetFilters||base.sheetFilters||null,
        columns:p.columns||base.columns||null,
        filters:p.filters||base.filters||[],
        isBuiltin:!!p.isBuiltin
      });
    });
    presets=Object.keys(byId).map(function(id){return byId[id];})
      .sort(function(a,b){return (b.isBuiltin?1:0)-(a.isBuiltin?1:0)||a.name.localeCompare(b.name);});
    initPresets();
  }).listCustomPresets();
}
function initPresets(){renderPresetList();}

function presetInitials(p){return p.icon||p.name.split(/\s+/).map(function(w){return w[0]||'';}).join('').substring(0,2).toUpperCase();}

function renderPresetList(){
  var wrap=document.getElementById('preset-list');if(!wrap)return;
  var q=((document.getElementById('preset-search')||{}).value||'').toLowerCase().trim();
  wrap.innerHTML='';
  var clear=document.createElement('div');
  clear.className='preset-item clear-item'+(_activePresetId?'':' active');
  clear.innerHTML='<div class="preset-icon">—</div><div class="preset-meta"><div class="preset-name">Без шаблону</div><div class="preset-desc">Ручні фільтри</div></div>';
  clear.onclick=function(){applyPreset(null);};
  wrap.appendChild(clear);
  var filtered=presets.filter(function(p){return !q||(p.name+' '+(p.description||'')).toLowerCase().indexOf(q)>=0;});
  if(!filtered.length){var e=document.createElement('div');e.className='preset-empty';e.textContent=q?'Нічого не знайдено':'Немає збережених звітів';wrap.appendChild(e);return;}
  filtered.forEach(function(p){
    var item=document.createElement('div');item.className='preset-item'+(p.id===_activePresetId?' active':'');
    var actions='';
    if(!p.isBuiltin||p.id==='commercial_proposals'||p.id==='project_starts'||p.id==='tenders'){
      actions+='<button title="Редагувати" onclick="event.stopPropagation();openPresetEditor(\''+p.id+'\')"><span class="edit-icon"></span></button>';
    }
    if(!p.isBuiltin){
      actions+='<button title="Видалити" onclick="event.stopPropagation();deletePresetConfirm(\''+p.id+'\')"><span class="trash-icon"></span></button>';
    }
    item.innerHTML='<div class="preset-icon">'+esc(presetInitials(p))+'</div><div class="preset-meta"><div class="preset-name">'+esc(p.name)+'</div><div class="preset-desc">'+esc(p.description||'Шаблон звіту')+'</div></div><div class="preset-actions">'+actions+'</div>';
    item.onclick=function(){applyPreset(p.id);};
    wrap.appendChild(item);
  });
}

function applyPreset(id){
  if(isDirty()){confirmLeave(function(){applyPreset(id);});return;}
  _activePresetId=id;
  renderPresetList();
  if(!id){document.getElementById('filter-rows').innerHTML='';window._presetOrConditions=[];window._presetColumns=null;window._presetSheetFilters=null;addFilterRow();_presetSnapshot=null;refreshDirtyUI();return;}
  var pr=presets.find(function(p){return p.id===id;});if(!pr)return;
  document.getElementById('filter-rows').innerHTML='';
  window._presetOrConditions=pr.orConditions||[];
  window._presetColumns=pr.columns||null;
  window._presetSheetFilters=pr.sheetFilters||null;
  if(pr.andConditions)pr.andConditions.forEach(function(f){addFilterRowWithData(f);});
  // Group repeating orConditions on the same field into one multi-select row (IN)
  if(pr.orConditions&&pr.orConditions.length){
    var byField={};
    pr.orConditions.forEach(function(f){if(!byField[f.field_id])byField[f.field_id]=[];byField[f.field_id].push(f.value);});
    Object.keys(byField).forEach(function(fid){
      var vals=byField[fid];
      if(vals.length>1)addFilterRowWithData({field_id:parseInt(fid),operator:'IN',value:vals});
      else addFilterRowWithData({field_id:parseInt(fid),operator:'=',value:vals[0]});
    });
  }
  if(pr.filters)pr.filters.forEach(function(f){addFilterRowWithData(f);});
  setTimeout(snapshotFilters,50);
}
function getActivePresetId(){return _activePresetId;}

// ===== DIRTY STATE TRACKING =====
var _presetSnapshot=null;
function snapshotFilters(){_presetSnapshot=JSON.stringify(collectConditionsSafe());refreshDirtyUI();}
function isDirty(){
  if(_presetSnapshot===null)return false;
  var now=JSON.stringify(collectConditionsSafe());
  return now!==_presetSnapshot;
}
function refreshDirtyUI(){
  var saveBtn=document.getElementById('btn-save-preset');
  var saveAsBtn=document.getElementById('btn-save-as');
  var hasFilters=collectConditionsSafe().length>0;
  if(saveBtn)saveBtn.style.display=(_activePresetId && isDirty())?'inline-flex':'none';
  if(saveAsBtn)saveAsBtn.style.display=(!_activePresetId && hasFilters)?'inline-flex':'none';
}
function installFilterObserver(){
  var root=document.getElementById('filter-rows');if(!root)return;
  root.addEventListener('input',refreshDirtyUI);
  root.addEventListener('change',refreshDirtyUI);
  root.addEventListener('click',function(ev){setTimeout(refreshDirtyUI,30);});
  new MutationObserver(refreshDirtyUI).observe(root,{childList:true,subtree:true,attributes:true});
}

function savePresetChanges(){
  if(!_activePresetId)return;
  var p=presets.find(function(x){return x.id===_activePresetId;});
  if(!p)return;
  var filters=collectConditionsSafe();
  var payload={id:p.id,name:p.name,icon:p.icon||'',description:p.description||'',filters:filters,enhanced:!!p.enhanced,funnelStages:p.funnelStages||null,columns:p.columns||null};
  var btn=document.getElementById('btn-save-preset');btn.disabled=true;btn.textContent='Збереження...';
  google.script.run.withSuccessHandler(function(r){
    btn.disabled=false;btn.textContent='Зберегти зміни';
    if(r&&r.error){showError(r.error);return;}
    snapshotFilters();
    refreshPresetsFromDB();
  }).withFailureHandler(function(e){
    btn.disabled=false;btn.textContent='Зберегти зміни';showError(e.message||String(e));
  }).saveCustomPreset(payload);
}

var _editingPresetId=null;
function openPresetEditor(id){
  _editingPresetId=id||null;
  var modal=document.getElementById('preset-editor-modal');
  var nameEl=document.getElementById('preset-editor-name');
  var iconEl=document.getElementById('preset-editor-icon');
  var descEl=document.getElementById('preset-editor-desc');
  document.getElementById('preset-editor-error').textContent='';
  document.getElementById('preset-editor-title').textContent=id?'Редагувати звіт':'Новий звіт';
  if(id){
    var p=presets.find(function(x){return x.id===id;})||{};
    nameEl.value=p.name||'';iconEl.value=p.icon||'';descEl.value=p.description||'';
  }else{nameEl.value='';iconEl.value='';descEl.value='';}
  refreshPresetFilterSummary();
  modal.style.display='flex';setTimeout(function(){nameEl.focus();},50);
}
function refreshPresetFilterSummary(){
  var conds=collectConditionsSafe();
  var sum=document.getElementById('preset-editor-filter-summary');
  if(!conds||!conds.length){sum.innerHTML='<span style="color:var(--gray-400)">Панель фільтрів порожня — звіт збережеться без умов.</span>';return;}
  sum.innerHTML=conds.map(function(c){
    var fld=fields.find(function(f){return f.field_id===c.field_id;});
    var name=fld?fld.label:'field '+c.field_id;
    var v=Array.isArray(c.value)?c.value.join(', '):c.value;
    return '<span class="filter-chip">'+esc(name)+' '+esc(c.operator)+' '+esc(String(v||''))+'</span>';
  }).join(' ');
}
function collectConditionsSafe(){
  try{hideError();var c=collectConditions();hideError();return c||[];}catch(e){return [];}
}
function savePresetFromEditor(){
  var name=(document.getElementById('preset-editor-name').value||'').trim();
  var icon=(document.getElementById('preset-editor-icon').value||'').trim().toUpperCase();
  var desc=(document.getElementById('preset-editor-desc').value||'').trim();
  var err=document.getElementById('preset-editor-error');err.textContent='';
  if(!name){err.textContent='Введіть назву';return;}
  var filters=collectConditionsSafe();
  var id=_editingPresetId||('custom_'+Date.now()+'_'+Math.floor(Math.random()*9999));
  var payload={id:id,name:name,icon:icon,description:desc,filters:filters,enhanced:false};
  var btn=document.getElementById('preset-editor-save-btn');btn.disabled=true;btn.innerHTML='<span class="ai-spinner"></span>Збереження...';
  google.script.run.withSuccessHandler(function(r){
    btn.disabled=false;btn.textContent='Зберегти';
    if(r&&r.error){err.textContent=r.error;return;}
    document.getElementById('preset-editor-modal').style.display='none';
    refreshPresetsFromDB();
    _activePresetId=id;setTimeout(renderPresetList,300);
  }).withFailureHandler(function(e){
    btn.disabled=false;btn.textContent='Зберегти';err.textContent=e.message||String(e);
  }).saveCustomPreset(payload);
}
function deletePresetConfirm(id){

// Лёгкий dropdown с поиском, группами и экранированием.
// opts: { placeholder, value, options: [{value,label,group?}], onChange(value,label) }
// Returns DOM element with methods .getValue()/.setValue(v)/.getLabel().
function buildSSel(opts){
  opts=opts||{};var multi=!!opts.multi;
  var wrap=document.createElement('div');wrap.className='ssel'+(multi?' ssel-multi':'');
  var inp=document.createElement('input');inp.type='text';inp.readOnly=true;inp.className='ssel-input';
  inp.placeholder=opts.placeholder||'— Оберіть —';
  var drop=document.createElement('div');drop.className='ssel-drop';
  var searchBox=document.createElement('div');searchBox.className='ssel-search';
  var search=document.createElement('input');search.type='text';search.placeholder='Пошук...';
  searchBox.appendChild(search);drop.appendChild(searchBox);
  var optsList=document.createElement('div');optsList.className='ssel-options';drop.appendChild(optsList);
  wrap.appendChild(inp);wrap.appendChild(drop);
  var currentValue=opts.value!==undefined?String(opts.value):'';
  var selectedSet=multi?{}:null;
  if(multi&&opts.value){String(opts.value).split(',').forEach(function(v){if(v!=='')selectedSet[v]=true;});}
  var allOptions=opts.options||[];

  function render(filter){
    filter=(filter||'').toLowerCase();
    optsList.innerHTML='';
    var lastGroup=null,shown=0;
    allOptions.forEach(function(o){
      if(filter&&String(o.label).toLowerCase().indexOf(filter)<0)return;
      if(o.group&&o.group!==lastGroup){
        var g=document.createElement('div');g.className='ssel-optgroup';g.textContent=o.group;
        optsList.appendChild(g);lastGroup=o.group;
      }
      var row=document.createElement('div');row.className='ssel-option';
      if(multi){
        var chk=document.createElement('span');chk.className='ssel-check'+(selectedSet[String(o.value)]?' on':'');
        row.appendChild(chk);var txt=document.createElement('span');txt.textContent=o.label;row.appendChild(txt);
        if(selectedSet[String(o.value)])row.classList.add('selected');
        row.onclick=function(ev){ev.stopPropagation();toggleValue(o.value);chk.classList.toggle('on',!!selectedSet[String(o.value)]);row.classList.toggle('selected');updateInput();if(opts.onChange)opts.onChange(getValue());};
      }else{
        if(String(o.value)===currentValue)row.classList.add('selected');
        row.textContent=o.label;
        row.onclick=function(ev){ev.stopPropagation();setValue(o.value,o.label);close();if(opts.onChange)opts.onChange(o.value,o.label);};
      }
      optsList.appendChild(row);shown++;
    });
    if(!shown){var e=document.createElement('div');e.className='ssel-empty';e.textContent='Нічого не знайдено';optsList.appendChild(e);}
  }
  function toggleValue(v){v=String(v);if(selectedSet[v])delete selectedSet[v];else selectedSet[v]=true;}
  function updateInput(){
    var keys=Object.keys(selectedSet);
    if(!keys.length){inp.value='';return;}
    var labels=keys.map(function(k){var m=allOptions.find(function(o){return String(o.value)===k;});return m?m.label:k;});
    inp.value=labels.length<=2?labels.join(', '):labels.slice(0,2).join(', ')+' +'+(labels.length-2);
  }
  function setValue(v,label){
    if(multi){
      selectedSet={};
      if(Array.isArray(v))v.forEach(function(x){if(x!=='')selectedSet[String(x)]=true;});
      else if(v!==undefined&&v!==null&&v!==''){String(v).split(',').forEach(function(x){if(x!=='')selectedSet[String(x)]=true;});}
      updateInput();return;
    }
    currentValue=v!==undefined&&v!==null?String(v):'';
    if(label===undefined){var m=allOptions.find(function(o){return String(o.value)===currentValue;});label=m?m.label:'';}
    inp.value=label||'';
  }
  function getValue(){if(multi)return Object.keys(selectedSet);return currentValue;}
  function open(){document.querySelectorAll('.ssel-drop.open').forEach(function(d){d.classList.remove('open');});drop.classList.add('open');search.value='';render('');setTimeout(function(){search.focus();},0);}
  function close(){drop.classList.remove('open');}
  inp.onclick=function(ev){ev.stopPropagation();if(drop.classList.contains('open'))close();else open();};
  search.oninput=function(){render(search.value);};
  search.onclick=function(ev){ev.stopPropagation();};
  drop.onclick=function(ev){ev.stopPropagation();};

  if(multi)updateInput();
  else if(currentValue){var m=allOptions.find(function(o){return String(o.value)===currentValue;});inp.value=m?m.label:'';}
  render('');

  wrap.getValue=getValue;
  wrap.setValue=setValue;
  wrap.isMulti=function(){return multi;};
  wrap.getLabel=function(){return inp.value;};
  return wrap;
}

    {value:'month',label:'Цей місяць',from:ymd(new Date(y,m,1)),to:ymd(new Date(y,m+1,0)),group:'Відносні періоди'},
    {value:'prevMonth',label:'Попередній місяць',from:ymd(lastMonthStart),to:ymd(lastMonthEnd),group:'Відносні періоди'},
    {value:'quarter',label:'Цей квартал',from:ymd(startQuarter),to:ymd(now),group:'Відносні періоди'},
    {value:'prevQuarter',label:'Попередній квартал',from:ymd(lastQStart),to:ymd(lastQEnd),group:'Відносні періоди'},
    {value:'year',label:'Цей рік',from:y+'-01-01',to:y+'-12-31',group:'Відносні періоди'},
    {value:'prevYear',label:'Попередній рік',from:(y-1)+'-01-01',to:(y-1)+'-12-31',group:'Відносні періоди'},
    {value:'last7',label:'Останні 7 днів',from:ymd(new Date(Date.now()-6*864e5)),to:ymd(now),group:'Діапазон від сьогодні'},

    {value:'last90',label:'Останні 90 днів',from:ymd(new Date(Date.now()-89*864e5)),to:ymd(now),group:'Діапазон від сьогодні'},
    {value:'custom',label:'Свій період',from:'',to:'',group:''}
  ];
}

function renderValue(field,op,vc){
  vc.innerHTML='';
  if(op==='IS NULL'||op==='IS NOT NULL')return;

  // ---- DATE: preset select + two date inputs ----
  if(field.type==='date'){
    var rangeRow=document.createElement('div');rangeRow.className='date-range-row';
    var presetsList=datePresets();
    var sselOpts=presetsList.map(function(p){return {value:p.value,label:p.label,group:p.group};});
    var d1=document.createElement('input');d1.type='date';d1.className='date-from';
    var sep=document.createElement('span');sep.textContent='—';
    var d2=document.createElement('input');d2.type='date';d2.className='date-to';
    var presetSel=buildSSel({
      options:sselOpts,placeholder:'— Період —',
      onChange:function(val){
        var p=presetsList.find(function(x){return x.value===val;});
        if(!p||p.value==='custom'){d1.focus();return;}
        d1.value=p.from;d2.value=p.to;
      }
    });
    presetSel.classList.add('ssel-date');
    [d1,d2].forEach(function(el){el.oninput=function(){presetSel.setValue('custom');};});
    rangeRow.appendChild(presetSel);rangeRow.appendChild(d1);rangeRow.appendChild(sep);rangeRow.appendChild(d2);
    vc.appendChild(rangeRow);return;
  }

  // ---- STATUS: colored pills (single-select) ----
  if(field.field_id===12464 && field.options&&field.options.length){
    var pg=document.createElement('div');pg.className='pill-group';var hidden=document.createElement('input');hidden.type='hidden';hidden.className='pill-value';
    field.options.forEach(function(o){
      var p=document.createElement('button');p.type='button';p.className='pill '+(o.id==='won'?'opt-won':o.id==='lost'?'opt-lost':'opt-open');p.textContent=o.label;p.dataset.val=o.id;
      p.onclick=function(){pg.querySelectorAll('.pill').forEach(function(x){x.classList.remove('active','won','lost','open');});p.classList.add('active');if(o.id==='won')p.classList.add('won');else if(o.id==='lost')p.classList.add('lost');else p.classList.add('open');hidden.value=o.id;};
      pg.appendChild(p);
    });
    vc.appendChild(pg);vc.appendChild(hidden);return;
  }

  // ---- PRODUCT NAME: searchable select ----
  if(field.field_id===12511 && productNames.length){
    var opts=productNames.map(function(n){return {value:n,label:n};});
    vc.appendChild(buildSSel({options:opts,placeholder:'— Оберіть товар —'}));return;
  }

  // ---- ENUM with field.options: searchable select (label if lost_reason) ----
  if(field.options&&field.options.length){
    var labelFields=[12475];
    var useLabel=labelFields.indexOf(field.field_id)>=0;
    var ops=field.options.map(function(o){return {value:useLabel?o.label:o.id,label:o.label};});
    vc.appendChild(buildSSel({options:ops,placeholder:'— Оберіть значення —'}));return;
  }

  // ---- PIPELINE ----
  if(field.type==='pipeline'){
    var ops=pipelines.map(function(p){return {value:p.id,label:p.name};});
    vc.appendChild(buildSSel({options:ops,placeholder:'— Оберіть воронку —'}));return;
  }

  // ---- STAGE (multi-select, cascaded via optgroup) ----
  if(field.type==='stage'){
    var ops=[];pipelines.forEach(function(p){(stages[p.id]||[]).forEach(function(s){ops.push({value:s.id,label:s.name,group:p.name});});});
    vc.appendChild(buildSSel({options:ops,placeholder:'— Оберіть етапи —',multi:true}));return;
  }

  // ---- USER (active/inactive groups) ----
  if(field.type==='user'){
    var ops=[];users.filter(function(u){return u.active;}).forEach(function(u){ops.push({value:u.id,label:u.name,group:'Активні'});});
    users.filter(function(u){return !u.active;}).forEach(function(u){ops.push({value:u.id,label:u.name,group:'Неактивні'});});
    vc.appendChild(buildSSel({options:ops,placeholder:'— Оберіть користувача —'}));return;
  }

  // ---- NUMBERS ----
  if(field.type==='int'||field.type==='monetary'){var inp=document.createElement('input');inp.type='number';inp.placeholder=field.type==='monetary'?'0':'';vc.appendChild(inp);return;}

  // ---- DEFAULT: text ----
  var inp=document.createElement('input');inp.type='text';inp.placeholder='Введіть значення...';vc.appendChild(inp);
}
function collectConditions(){
  var conds=[],rows=document.querySelectorAll('.filter-row');
  for(var i=0;i<rows.length;i++){
    var fs=rows[i].querySelector('.field-select');if(!fs)continue;
    var os=rows[i].querySelector('.operator-select');if(!fs.value)continue;
    var fid=parseInt(fs.value);var op=os.value;var field=fields.find(function(f){return f.field_id===fid;});
    if(op==='IS NULL'||op==='IS NOT NULL'){conds.push({field_id:fid,operator:op,value:'',extra_value:null});continue;}
    if(field&&field.type==='date'){
      var d1=rows[i].querySelector('.date-from');var d2=rows[i].querySelector('.date-to');
      if(d1&&d1.value)conds.push({field_id:fid,operator:'>=',value:d1.value,extra_value:null});
      if(d2&&d2.value)conds.push({field_id:fid,operator:'<=',value:d2.value,extra_value:null});
      continue;
    }
    var val='';
    var sselEl=rows[i].querySelector('.value-container .ssel');
    if(sselEl&&typeof sselEl.getValue==='function'){
      val=sselEl.getValue();
      if(Array.isArray(val)){
        if(!val.length)continue;
        conds.push({field_id:fid,operator:'IN',value:val,extra_value:null});continue;
      }
    }else{
      var hidden=rows[i].querySelector('.value-container .pill-value');
      if(hidden)val=hidden.value;
      else{var inp=rows[i].querySelector('.value-container select, .value-container input');if(inp)val=inp.value;}
    }
    if(val!=='')conds.push({field_id:fid,operator:op,value:val,extra_value:null});
  }
  if(conds.length>16){showError('Максимум 16 умов');return null;}
  if(conds.length===0){showError('Додайте хоча б одну умову');return null;}
  return conds;
}

function runReport(){
  var selVal=getActivePresetId();
  var pr=selVal?presets.find(function(p){return p.id===selVal;}):null;
  if(pr&&pr.sheetFilters){
    showLoading(true);hideError();document.getElementById('report-section').style.display='none';
    var gb=document.getElementById('group-by').value;
    google.script.run.withSuccessHandler(function(r){showLoading(false);if(r.error){showError(r.error);return;}lastData=r;renderReport(r);}).withFailureHandler(function(e){showLoading(false);showError(e.message);}).buildReportFromDB(pr.sheetFilters,gb);

  window._presetColumns=null;
  var c=collectConditions();if(!c)return;showLoading(true);hideError();
  document.getElementById('report-section').style.display='none';
  // Convert field_id conditions to SQL filters
  var dbFilters=c.map(function(cond){
    var col=FIELD_ID_TO_SQL[cond.field_id];if(!col)return null;
    var opMap={'=':'=','!=':'!=','>=':'>=','<=':'<=','>':'>','<':'<','LIKE':'contains','IS NULL':'is null','IS NOT NULL':'is not null','IN':'in'};

  }).filter(function(x){return x;});

function renderFunnel(deals,preset){
  var box=document.getElementById('chart-funnel');
  var stages=(preset&&preset.funnelStages)||[];
  if(!stages.length){box.style.display='none';return;}
  var counts={};stages.forEach(function(s){counts[s.id]={open:0,won:0,lost:0};});
  deals.forEach(function(d){if(counts[d.stage_id])counts[d.stage_id][d.status]=(counts[d.stage_id][d.status]||0)+1;});
  var dt=new google.visualization.DataTable();
  dt.addColumn('string','Етап');dt.addColumn('number','Відкриті');dt.addColumn('number','Виграні');dt.addColumn('number','Програні');
  stages.forEach(function(s){var c=counts[s.id];dt.addRow([s.name,c.open||0,c.won||0,c.lost||0]);});
  box.innerHTML='<div class="chart-title">Воронка КП по етапах<span class="hint">де застрягли угоди</span></div><div id="chart-funnel-canvas" style="height:340px"></div>';
  box.style.display='block';
  new google.visualization.ColumnChart(document.getElementById('chart-funnel-canvas')).draw(dt,chartOpts({
    isStacked:true,colors:[CHART_COLORS.primary,CHART_COLORS.success,CHART_COLORS.danger],bar:{groupWidth:'62%'},
    hAxis:{slantedText:true,slantedTextAngle:20,textStyle:{fontSize:11,color:'#6b7280'}}
  }));
}

var _lossDealsCache={};
function renderLossReasons(deals){
  var box=document.getElementById('chart-loss-reasons');
  var lost=deals.filter(function(d){return d.status==='lost';});
  if(!lost.length){box.style.display='none';return;}
  var byReason={};_lossDealsCache={};
  lost.forEach(function(d){
    var r=d.lost_reason||'(не вказано)';
    byReason[r]=(byReason[r]||0)+1;
    if(!_lossDealsCache[r])_lossDealsCache[r]=[];
    _lossDealsCache[r].push(d);
  });
  var dt=new google.visualization.DataTable();dt.addColumn('string','Причина');dt.addColumn('number','Угод');
  Object.keys(byReason).forEach(function(k){dt.addRow([k,byReason[k]]);});
  box.innerHTML='<div class="chart-title">Причини програшу<span class="hint">клік по сектору — коментарі</span></div><div id="chart-loss-canvas" style="height:420px;cursor:pointer"></div>';
  box.style.display='block';
  var chart=new google.visualization.PieChart(document.getElementById('chart-loss-canvas'));
  chart.draw(dt,chartOpts({
    pieHole:0.5,
    legend:{position:'labeled',textStyle:{fontSize:11,color:'#4b5563'},maxLines:3},
    pieSliceText:'percentage',
    pieSliceTextStyle:{fontSize:11,color:'#fff'},
    chartArea:{left:40,right:40,top:20,bottom:20,width:'88%',height:'88%'},
    colors:['#ef4444','#f59e0b','#f97316','#dc2626','#fb7185','#fda4af','#991b1b','#b45309','#c2410c','#7c2d12','#fbbf24','#facc15','#f472b6','#e879f9','#c084fc']
  }));
  google.visualization.events.addListener(chart,'select',function(){
    var sel=chart.getSelection();if(!sel.length)return;
    var reason=dt.getValue(sel[0].row,0);showLossComments(reason);
  });
}

function showLossComments(reason){
  var dl=_lossDealsCache[reason]||[];
  document.getElementById('loss-comments-title').textContent='Програні КП: '+reason+' ('+dl.length+')';
  document.getElementById('loss-comments-list').innerHTML=dl.map(function(d){
    var title=esc(d.title||'(без назви)');
    var comment=d.c_loss_comment?esc(d.c_loss_comment):'<em style="color:#aaa">коментар не заповнений</em>';
    var owner=esc(d.owner_name||'');var val=formatMoney(d.value);
    return '<div class="loss-comment-item"><div class="deal-title"><a href="https://webpromo.pipedrive.com/deal/'+d.id+'" target="_blank">'+title+'</a></div><div class="comment-text">'+comment+'</div><div class="meta">'+owner+' · '+val+'</div></div>';
  }).join('')||'<p style="color:#888">Немає угод</p>';
  document.getElementById('loss-comments-modal').style.display='flex';
}

function renderMonthlyTrend(deals){
  var box=document.getElementById('chart-monthly-trend');
  var months={};
  deals.forEach(function(d){
    if(!d.add_time)return;
    var m=String(d.add_time).substring(0,7);
    if(!months[m])months[m]={created:0,won:0,lost:0};
    months[m].created++;
    if(d.status==='won')months[m].won++;
    else if(d.status==='lost')months[m].lost++;
  });
  var keys=Object.keys(months).sort();
  if(!keys.length){box.style.display='none';return;}
  var dt=new google.visualization.DataTable();
  dt.addColumn('string','Місяць');dt.addColumn('number','Створено');dt.addColumn('number','Виграно');dt.addColumn('number','Програно');
  keys.forEach(function(k){var m=months[k];dt.addRow([k,m.created,m.won,m.lost]);});
  box.innerHTML='<div class="chart-title">Динаміка КП по місяцях<span class="hint">створено vs виграно vs програно</span></div><div id="chart-monthly-canvas" style="height:340px"></div>';
  box.style.display='block';
  new google.visualization.LineChart(document.getElementById('chart-monthly-canvas')).draw(dt,chartOpts({
    colors:[CHART_COLORS.gray,CHART_COLORS.success,CHART_COLORS.danger],
    pointSize:6,pointShape:'circle',curveType:'function',lineWidth:2.5,
    chartArea:{left:52,right:24,top:40,bottom:40}
  }));
}

function renderConvByManager(deals){
  var box=document.getElementById('chart-conv-manager');
  var byMgr={};
  deals.forEach(function(d){
    var n=d.owner_name||'(не вказано)';
    if(!byMgr[n])byMgr[n]={total:0,won:0,lost:0,open:0};
    byMgr[n].total++;byMgr[n][d.status]=(byMgr[n][d.status]||0)+1;
  });
  var rows=Object.keys(byMgr).map(function(k){var m=byMgr[k];m.name=k;m.winRate=m.total>0?Math.round(m.won/m.total*100):0;return m;}).sort(function(a,b){return b.total-a.total;});
  if(!rows.length){box.style.display='none';return;}
  var dt=new google.visualization.DataTable();
  dt.addColumn('string','Менеджер');dt.addColumn('number','Виграні');dt.addColumn('number','Програні');dt.addColumn('number','Відкриті');dt.addColumn({type:'string',role:'annotation'});
  rows.forEach(function(m){dt.addRow([m.name,m.won,m.lost,m.open,m.winRate+'%']);});
  box.innerHTML='<div class="chart-title">Конверсія по менеджерах<span class="hint">win-rate % над стовпчиком</span></div><div id="chart-mgr-canvas" style="height:380px"></div>';
  box.style.display='block';
  new google.visualization.ColumnChart(document.getElementById('chart-mgr-canvas')).draw(dt,chartOpts({
    isStacked:true,colors:[CHART_COLORS.success,CHART_COLORS.danger,CHART_COLORS.primary],
    bar:{groupWidth:'62%'},
    hAxis:{slantedText:true,slantedTextAngle:30,textStyle:{fontSize:11,color:'#6b7280'}},
    annotations:{alwaysOutside:true,textStyle:{fontSize:11,color:'#374151',bold:true}},
    chartArea:{left:48,right:24,top:40,bottom:100}
  }));
}

function renderHeatmapStageManager(deals,preset){
  var box=document.getElementById('chart-heatmap');
  var stages=(preset&&preset.funnelStages)||[];
  if(!stages.length){box.style.display='none';return;}
  var mgrs={};
  deals.forEach(function(d){var n=d.owner_name||'(не вказано)';if(!mgrs[n])mgrs[n]={};mgrs[n][d.stage_id]=(mgrs[n][d.stage_id]||0)+1;});
  var mgrList=Object.keys(mgrs).sort(function(a,b){
    var ta=0,tb=0;stages.forEach(function(s){ta+=mgrs[a][s.id]||0;tb+=mgrs[b][s.id]||0;});
    return tb-ta;
  });
  if(!mgrList.length){box.style.display='none';return;}
  var max=0;mgrList.forEach(function(m){stages.forEach(function(s){var v=mgrs[m][s.id]||0;if(v>max)max=v;});});
  var html='<div class="chart-title">Менеджер × Етап<span class="hint">де кладовища угод</span></div><div style="overflow-x:auto"><table class="heatmap-table"><thead><tr><th>Менеджер</th>';
  stages.forEach(function(s){html+='<th>'+esc(s.name)+'</th>';});html+='<th>Всього</th></tr></thead><tbody>';
  mgrList.forEach(function(m){
    html+='<tr><td class="mgr">'+esc(m)+'</td>';var total=0;
    stages.forEach(function(s){
      var v=mgrs[m][s.id]||0;total+=v;
      var bg=heatColor(v,max);
      html+='<td class="cell" style="background:'+bg+'">'+(v||'')+'</td>';
    });
    html+='<td class="mgr">'+total+'</td></tr>';
  });
  html+='</tbody></table></div><div class="heatmap-legend">Чим темніша клітинка — тим більше КП у менеджера на цьому етапі</div>';
  box.innerHTML=html;box.style.display='block';
}

function heatColor(v,max){
  if(!v||max<=0)return '#fff';
  var t=v/max;var r=Math.round(255-(255-49)*t),g=Math.round(255-(255-122)*t),b=Math.round(255-(255-226)*t);
  return 'rgb('+r+','+g+','+b+')';
}

function renderSummary(t){
  document.getElementById('summary-cards').innerHTML=
    '<div class="card"><div class="num">'+t.total+'</div><div class="lbl">Всього угод</div></div>'+
    '<div class="card won"><div class="num">'+t.won+' ('+t.conversion_rate+'%)</div><div class="lbl">Виграно</div></div>'+
    '<div class="card lost"><div class="num">'+t.lost+'</div><div class="lbl">Програно</div></div>'+
    '<div class="card open"><div class="num">'+t.open+'</div><div class="lbl">Відкриті</div></div>'+
    '<div class="card"><div class="num">'+formatMoney(t.won_value)+'</div><div class="lbl">Сума виграних</div></div>'+
    '<div class="card"><div class="num">'+formatMoney(t.open_value)+'</div><div class="lbl">Сума відкритих</div></div>';
}

  google.charts.setOnLoadCallback(function(){
    if(ch.convByOwner&&ch.convByOwner.length){
      var dt=new google.visualization.DataTable();dt.addColumn('string','Менеджер');dt.addColumn('number','Won');dt.addColumn('number','Lost');dt.addColumn('number','Open');
      ch.convByOwner.forEach(function(o){dt.addRow([o.name,o.won,o.lost,o.open]);});
      new google.visualization.ColumnChart(document.getElementById('chart-owners')).draw(dt,{title:'Конверсія по менеджерах',isStacked:true,colors:['#27ae60','#e74c3c','#3498db'],legend:{position:'top'},height:350,chartArea:{width:'80%'}});
    }
    if(ch.dealsByMonth&&ch.dealsByMonth.length){
      var dt2=new google.visualization.DataTable();dt2.addColumn('string','Місяць');dt2.addColumn('number','Всього');dt2.addColumn('number','Won');dt2.addColumn('number','Lost');
      ch.dealsByMonth.forEach(function(m){dt2.addRow([m.month,m.total,m.won,m.lost]);});
      new google.visualization.LineChart(document.getElementById('chart-months')).draw(dt2,{title:'Динаміка по місяцях',colors:['#333','#27ae60','#e74c3c'],legend:{position:'top'},height:350,chartArea:{width:'80%'}});
    }
    if(ch.dealsByPipeline&&ch.dealsByPipeline.length){
      var dt3=new google.visualization.DataTable();dt3.addColumn('string','Воронка');dt3.addColumn('number','Угод');
      ch.dealsByPipeline.forEach(function(p){dt3.addRow([p.name,p.count]);});
      new google.visualization.PieChart(document.getElementById('chart-pipelines')).draw(dt3,{title:'Розподіл по воронках',height:350,chartArea:{width:'90%'}});
    }
  });
}

function renderGroups(groups){var c=document.getElementById('group-tables');c.innerHTML='';if(!groups||!groups.length)return;groups.forEach(function(g,i){c.innerHTML+='<div class="group-section"><div class="group-header" onclick="toggleGroup('+i+')"><span class="group-name">'+g.name+'</span><span class="group-stats">'+g.total+' угод | '+formatMoney(g.value)+' | Конверсія: '+g.conversion_rate+'%</span></div><div class="group-body" id="gb-'+i+'"></div></div>';});}
function toggleGroup(i){document.getElementById('gb-'+i).classList.toggle('open');}

// ===== TABLE =====
var TABLE_COLS=[
  {key:'title',label:'Назва',link:true},{key:'owner_name',label:'Власник'},{key:'pipeline_name',label:'Воронка'},
  {key:'stage_name',label:'Етап'},{key:'status',label:'Стан',badge:true},{key:'value',label:'Вартість',money:true},
  {key:'add_time',label:'Дата створення',date:true},{key:'label',label:'Мітка'},
  {key:'lost_reason',label:'Причина програшу'},{key:'person_name',label:'Контакт'},{key:'org_name',label:'Організація'}
];

function getActiveCols(){return window._presetColumns||TABLE_COLS;}

var PAGE_SIZE=50,currentPage=1;
function renderTable(deals){
  var cols=getActiveCols();
  document.getElementById('deals-thead').innerHTML='<tr>'+cols.map(function(c){return '<th onclick="sortTable(\''+c.key+'\')">'+c.label+'<span class="sort-icon" id="si-'+c.key+'"></span></th>';}).join('')+'</tr>';
  var badge=document.getElementById('table-count');if(badge)badge.textContent=(deals||[]).length.toLocaleString('uk-UA')+' угод';
  currentPage=1;
  renderPage(deals);
}
function renderPage(deals){
  var total=(deals||[]).length;
  var pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(currentPage>pages)currentPage=pages;
  var start=(currentPage-1)*PAGE_SIZE;var end=Math.min(start+PAGE_SIZE,total);
  fillTableBody((deals||[]).slice(start,end));
  renderPagination(total,pages,start,end);
}
function renderPagination(total,pages,start,end){
  var el=document.getElementById('pagination');if(!el)return;
  if(total<=PAGE_SIZE){el.innerHTML='';el.style.display='none';return;}
  el.style.display='flex';
  var info='<span class="info">'+(total?(start+1):0)+'–'+end+' з '+total.toLocaleString('uk-UA')+'</span>';
  var ctrl='<div class="controls">';
  ctrl+='<button class="page-btn" onclick="gotoPage(1)" '+(currentPage===1?'disabled':'')+'>«</button>';
  ctrl+='<button class="page-btn" onclick="gotoPage('+(currentPage-1)+')" '+(currentPage===1?'disabled':'')+'>‹</button>';
  var pageNums=buildPageNumbers(currentPage,pages);
  pageNums.forEach(function(n){
    if(n==='...')ctrl+='<span class="page-ellipsis">…</span>';
    else ctrl+='<button class="page-btn '+(n===currentPage?'current':'')+'" onclick="gotoPage('+n+')">'+n+'</button>';
  });
  ctrl+='<button class="page-btn" onclick="gotoPage('+(currentPage+1)+')" '+(currentPage===pages?'disabled':'')+'>›</button>';
  ctrl+='<button class="page-btn" onclick="gotoPage('+pages+')" '+(currentPage===pages?'disabled':'')+'>»</button>';
  ctrl+='</div>';
  el.innerHTML=info+ctrl;
}
function buildPageNumbers(cur,total){
  if(total<=7){var a=[];for(var i=1;i<=total;i++)a.push(i);return a;}
  var r=[1];
  if(cur>3)r.push('...');
  for(var i=Math.max(2,cur-1);i<=Math.min(total-1,cur+1);i++)r.push(i);
  if(cur<total-2)r.push('...');
  r.push(total);return r;
}
function gotoPage(n){if(!lastData||!lastData.deals)return;var pages=Math.max(1,Math.ceil(lastData.deals.length/PAGE_SIZE));if(n<1||n>pages)return;currentPage=n;renderPage(lastData.deals);window.scrollTo({top:document.querySelector('.table-wrap').offsetTop-20,behavior:'smooth'});}

function fillTableBody(deals){
  var cols=getActiveCols();
  document.getElementById('deals-tbody').innerHTML=deals.map(function(d){
    return '<tr>'+cols.map(function(c){
      var v=d[c.key]||'';
      if(c.key==='title')return '<td><a href="https://webpromo.pipedrive.com/deal/'+d.id+'" target="_blank">'+esc(v)+'</a></td>';
      if(c.link&&v)return '<td><a href="'+esc(v)+'" target="_blank">Відкрити</a></td>';
      if(c.stage&&d.stage_name)return '<td>'+esc(d.stage_name)+'</td>';
      if(c.badge)return '<td><span class="status-badge status-'+v+'">'+statusLabel(v)+'</span></td>';
      if(c.money)return '<td style="text-align:right">'+formatMoney(v)+'</td>';
      if(c.date)return '<td>'+formatDate(v)+'</td>';
      return '<td>'+esc(String(v))+'</td>';
    }).join('')+'</tr>';
  }).join('');
}
function sortTable(col){
  if(sortCol===col)sortDir=sortDir==='asc'?'desc':'asc';else{sortCol=col;sortDir='asc';}
  document.querySelectorAll('.sort-icon').forEach(function(s){s.textContent='';});
  var icon=document.getElementById('si-'+col);if(icon)icon.textContent=sortDir==='asc'?' ▲':' ▼';
  lastData.deals.sort(function(a,b){var va=a[col]||'',vb=b[col]||'';if(typeof va==='number')return sortDir==='asc'?va-vb:vb-va;return sortDir==='asc'?String(va).localeCompare(String(vb)):String(vb).localeCompare(String(va));});
  currentPage=1;renderPage(lastData.deals);
}

function formatMoney(v){if(v===null||v===undefined||v==='')return'—';return new Intl.NumberFormat('uk-UA',{maximumFractionDigits:0}).format(Number(v));}
function formatDate(s){if(!s)return'';var d=new Date(s);return d.toLocaleDateString('uk-UA');}
function statusLabel(s){return s==='won'?'Виграна':s==='lost'?'Програна':s==='open'?'Відкрита':s;}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function showLoading(v){document.getElementById('loading').style.display=v?'block':'none';}
function showError(m){document.getElementById('error-bar').style.display='block';document.getElementById('error-bar').textContent=m;}
function hideError(){document.getElementById('error-bar').style.display='none';}
</script>
