<script>
var fields=[],pipelines=[],users=[],stages={},opLabels={},presets=[],lastData=null,sortCol=null,sortDir='asc';
var productNames=[];
window._presetOrConditions=[];window._presetColumns=null;

google.charts.load('current',{packages:['corechart','bar']});

document.addEventListener('DOMContentLoaded',function(){
  google.script.run.withSuccessHandler(function(f){fields=f;addFilterRow();}).getFieldsConfig();
  google.script.run.withSuccessHandler(function(p){pipelines=p;}).getPipelinesConfig();
  google.script.run.withSuccessHandler(function(u){users=u;}).getUsersConfig();
  google.script.run.withSuccessHandler(function(s){stages=s;}).getAllStages();
  google.script.run.withSuccessHandler(function(o){opLabels=o;}).getOperatorsLabels();
  google.script.run.withSuccessHandler(function(p){presets=p;initPresets();}).getPresetReports();
  google.script.run.withSuccessHandler(function(p){productNames=p||[];}).getProductNames();
  // Override hardcoded data with real values from DB
  google.script.run.withSuccessHandler(function(u){if(u&&u.length)users=u.map(function(r){return {id:r.id,name:r.name,active:r.active};});}).getUsersFromDB();
  google.script.run.withSuccessHandler(function(p){if(p&&p.length)pipelines=p;}).getPipelinesFromDB();
  google.script.run.withSuccessHandler(function(s){if(s&&Object.keys(s).length)stages=s;}).getStagesFromDB();
  google.script.run.withSuccessHandler(function(m){
    // Override field options with real DB values
    if(!m||!Object.keys(m).length)return;
    fields.forEach(function(f){if(m[f.field_id])f.options=m[f.field_id];});
  }).getFieldOptionsFromDB();
  var y=new Date().getFullYear();
  document.getElementById('date-from').value=y+'-01-01';
  document.getElementById('date-to').value=y+'-12-31';
});

// ===== SYNC MODAL =====
function refreshData(){
  var df=document.getElementById('date-from').value;
  var dt=document.getElementById('date-to').value;
  if(!df||!dt){showError('Оберіть період');return;}
  document.getElementById('sync-modal').style.display='flex';
  document.getElementById('sync-progress').style.display='block';
  document.getElementById('sync-result').style.display='none';
  google.script.run.withSuccessHandler(function(r){
    document.getElementById('sync-progress').style.display='none';
    document.getElementById('sync-result').style.display='block';
    if(r.error){
      document.getElementById('sync-result-icon').textContent='❌';
      document.getElementById('sync-result-title').textContent='Помилка синхронізації';
      document.getElementById('sync-result-table').innerHTML='<p style="color:#c00">'+r.error+'</p>';
      return;
    }
    var results=r.results||[];
    var totalAll=results.reduce(function(s,x){return s+x.inserted;},0);
    var errAll=results.reduce(function(s,x){return s+x.errors;},0);
    var elapsed=results.reduce(function(s,x){return s+(x.elapsed||0);},0);
    document.getElementById('sync-result-icon').textContent=errAll>0?'⚠️':'✅';
    document.getElementById('sync-result-title').textContent=totalAll.toLocaleString('uk-UA')+' записів синхронізовано';
    var html='<table><tr><th>Сутність</th><th>Записів</th><th>Успіх</th></tr>';
    results.forEach(function(res){
      var pct=res.total>0?(res.inserted/res.total*100).toFixed(res.errors>0?2:0)+'%':'—';
      var cls=res.errors>0?'error':'success';
      var cnt=res.errors>0?res.inserted+'/'+res.total:res.total.toLocaleString('uk-UA');
      html+='<tr><td>'+res.entity+'</td><td>'+cnt+'</td><td class="'+cls+'">'+pct+'</td></tr>';
    });
    html+='</table>';
    document.getElementById('sync-result-table').innerHTML=html;
    document.getElementById('sync-result-time').textContent='Час: '+Math.floor(elapsed/60)+'хв '+elapsed%60+'с';
  }).withFailureHandler(function(e){
    document.getElementById('sync-progress').style.display='none';
    document.getElementById('sync-result').style.display='block';
    document.getElementById('sync-result-icon').textContent='❌';
    document.getElementById('sync-result-title').textContent='Помилка';
    document.getElementById('sync-result-table').innerHTML='<p>'+e.message+'</p>';
  }).refreshAllData(df,dt);
}
function closeSyncModal(){document.getElementById('sync-modal').style.display='none';}

// ===== PRESETS =====
var _activePresetId=null;
function initPresets(){
  var wrap=document.getElementById('preset-cards');
  if(!wrap)return;
  wrap.innerHTML='';
  var clearBtn=document.createElement('div');
  clearBtn.className='preset-card clear';clearBtn.innerHTML='<span style="font-size:16px">✖</span><div><div class="preset-name">Без шаблону</div><div class="preset-desc">Ручні фільтри</div></div>';
  clearBtn.onclick=function(){applyPreset(null);};
  wrap.appendChild(clearBtn);
  presets.forEach(function(p){
    var card=document.createElement('div');card.className='preset-card';card.dataset.id=p.id;
    var icon=p.icon||'📊';
    card.innerHTML='<div class="preset-icon">'+icon+'</div><div><div class="preset-name">'+esc(p.name)+'</div><div class="preset-desc">'+esc(p.description||'Шаблон звіту')+'</div></div>';
    card.onclick=function(){applyPreset(p.id);};
    wrap.appendChild(card);
  });
}

function applyPreset(id){
  _activePresetId=id;
  document.querySelectorAll('.preset-card').forEach(function(c){c.classList.toggle('active',c.dataset.id===id);});
  if(!id){document.getElementById('filter-rows').innerHTML='';window._presetOrConditions=[];window._presetColumns=null;window._presetSheetFilters=null;addFilterRow();return;}
  var pr=presets.find(function(p){return p.id===id;});if(!pr)return;
  document.getElementById('filter-rows').innerHTML='';
  window._presetOrConditions=pr.orConditions||[];
  window._presetColumns=pr.columns||null;
  window._presetSheetFilters=pr.sheetFilters||null;
  if(pr.andConditions)pr.andConditions.forEach(function(f){addFilterRowWithData(f);});
  if(pr.orConditions)pr.orConditions.forEach(function(f){addFilterRowWithData(f);});
  if(pr.filters)pr.filters.forEach(function(f){addFilterRowWithData(f);});
}
function getActivePresetId(){return _activePresetId;}

// ===== SEARCHABLE SELECT =====
// Лёгкий dropdown с поиском, группами и экранированием.
// opts: { placeholder, value, options: [{value,label,group?}], onChange(value,label) }
// Returns DOM element with methods .getValue()/.setValue(v)/.getLabel().
function buildSSel(opts){
  opts=opts||{};
  var wrap=document.createElement('div');wrap.className='ssel';
  var inp=document.createElement('input');inp.type='text';inp.readOnly=true;inp.className='ssel-input';
  inp.placeholder=opts.placeholder||'— Оберіть —';
  var drop=document.createElement('div');drop.className='ssel-drop';
  var searchBox=document.createElement('div');searchBox.className='ssel-search';
  var search=document.createElement('input');search.type='text';search.placeholder='Пошук...';
  searchBox.appendChild(search);drop.appendChild(searchBox);
  var optsList=document.createElement('div');optsList.className='ssel-options';drop.appendChild(optsList);
  wrap.appendChild(inp);wrap.appendChild(drop);
  var currentValue=opts.value!==undefined?String(opts.value):'';
  var allOptions=opts.options||[];

  function render(filter){
    filter=(filter||'').toLowerCase();
    optsList.innerHTML='';
    var lastGroup=null,shown=0;
    allOptions.forEach(function(o){
      if(filter&&String(o.label).toLowerCase().indexOf(filter)<0)return;
      if(o.group&&o.group!==lastGroup){
        var g=document.createElement('div');g.className='ssel-optgroup';g.textContent=o.group;
        optsList.appendChild(g);lastGroup=o.group;
      }
      var row=document.createElement('div');row.className='ssel-option';
      if(String(o.value)===currentValue)row.classList.add('selected');
      row.textContent=o.label;
      row.onclick=function(ev){ev.stopPropagation();setValue(o.value,o.label);close();if(opts.onChange)opts.onChange(o.value,o.label);};
      optsList.appendChild(row);shown++;
    });
    if(!shown){var e=document.createElement('div');e.className='ssel-empty';e.textContent='Нічого не знайдено';optsList.appendChild(e);}
  }
  function setValue(v,label){
    currentValue=v!==undefined&&v!==null?String(v):'';
    if(label===undefined){
      var m=allOptions.find(function(o){return String(o.value)===currentValue;});
      label=m?m.label:'';
    }
    inp.value=label||'';
  }
  function open(){document.querySelectorAll('.ssel-drop.open').forEach(function(d){d.classList.remove('open');});drop.classList.add('open');search.value='';render('');setTimeout(function(){search.focus();},0);}
  function close(){drop.classList.remove('open');}
  inp.onclick=function(ev){ev.stopPropagation();if(drop.classList.contains('open'))close();else open();};
  search.oninput=function(){render(search.value);};
  search.onclick=function(ev){ev.stopPropagation();};
  drop.onclick=function(ev){ev.stopPropagation();};

  // init
  if(currentValue){
    var m=allOptions.find(function(o){return String(o.value)===currentValue;});
    inp.value=m?m.label:'';
  }
  render('');

  wrap.getValue=function(){return currentValue;};
  wrap.setValue=setValue;
  wrap.getLabel=function(){return inp.value;};
  return wrap;
}
document.addEventListener('click',function(){document.querySelectorAll('.ssel-drop.open').forEach(function(d){d.classList.remove('open');});});

// ===== FILTER ROWS =====
function addFilterRow(){window._presetOrConditions=[];window._presetColumns=null;window._presetSheetFilters=null;
  var div=document.createElement('div');div.className='filter-row';
  var fs=document.createElement('select');fs.className='field-select';
  var def=document.createElement('option');def.value='';def.textContent='— Оберіть поле —';fs.appendChild(def);
  fields.forEach(function(f){var o=document.createElement('option');o.value=f.field_id;o.textContent=f.label;fs.appendChild(o);});
  var os=document.createElement('select');os.className='operator-select';os.disabled=true;
  var vc=document.createElement('div');vc.className='value-container';
  var rb=document.createElement('button');rb.className='btn-remove';rb.innerHTML='&times;';rb.onclick=function(){div.remove();};
  fs.onchange=function(){onFieldChange(div,fs,os,vc);};
  div.appendChild(fs);div.appendChild(os);div.appendChild(vc);div.appendChild(rb);
  document.getElementById('filter-rows').appendChild(div);
}
function addFilterRowWithData(data){
  addFilterRow();var rows=document.querySelectorAll('.filter-row');var row=rows[rows.length-1];
  var fs=row.querySelector('.field-select');fs.value=data.field_id;fs.onchange();
  var os=row.querySelector('.operator-select');os.value=data.operator;if(os.onchange)os.onchange();
  if(data.value===''||data.value===undefined||data.value===null)return;
  var vc=row.querySelector('.value-container');
  var sselEl=vc.querySelector('.ssel');
  if(sselEl&&typeof sselEl.setValue==='function'){sselEl.setValue(data.value);return;}
  var hidden=vc.querySelector('.pill-value');
  if(hidden){var btn=vc.querySelector('.pill[data-val="'+data.value+'"]');if(btn)btn.click();return;}
  var inp=vc.querySelector('select,input');
  if(inp)inp.value=data.value;
}
function onFieldChange(row,fs,os,vc){
  var fid=parseInt(fs.value);var field=fields.find(function(f){return f.field_id===fid;});
  os.innerHTML='';os.disabled=false;vc.innerHTML='';
  if(!field){os.disabled=true;return;}
  field.operators.forEach(function(op){var o=document.createElement('option');o.value=op;o.textContent=opLabels[op]||op;os.appendChild(o);});
  os.onchange=function(){renderValue(field,os.value,vc);};
  renderValue(field,field.operators[0],vc);
}
// ===== DATE PRESETS =====
function ymd(d){var m=String(d.getMonth()+1).padStart(2,'0');var day=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+day;}
function datePresets(){
  var now=new Date();var y=now.getFullYear();var m=now.getMonth();
  var startWeek=new Date(now);startWeek.setDate(now.getDate()-((now.getDay()+6)%7));
  var startQuarter=new Date(y,Math.floor(m/3)*3,1);
  var lastMonthStart=new Date(y,m-1,1),lastMonthEnd=new Date(y,m,0);
  var lastQStart=new Date(y,Math.floor(m/3)*3-3,1),lastQEnd=new Date(y,Math.floor(m/3)*3,0);
  return [
    {key:'today',label:'Сьогодні',from:ymd(now),to:ymd(now)},
    {key:'week',label:'Цей тиждень',from:ymd(startWeek),to:ymd(now)},
    {key:'month',label:'Цей місяць',from:ymd(new Date(y,m,1)),to:ymd(now)},
    {key:'quarter',label:'Цей квартал',from:ymd(startQuarter),to:ymd(now)},
    {key:'year',label:'Цей рік',from:y+'-01-01',to:y+'-12-31'},
    {key:'last7',label:'7 днів',from:ymd(new Date(Date.now()-6*864e5)),to:ymd(now)},
    {key:'last30',label:'30 днів',from:ymd(new Date(Date.now()-29*864e5)),to:ymd(now)},
    {key:'last90',label:'90 днів',from:ymd(new Date(Date.now()-89*864e5)),to:ymd(now)},
    {key:'prevMonth',label:'Попередній місяць',from:ymd(lastMonthStart),to:ymd(lastMonthEnd)},
    {key:'prevQuarter',label:'Попередній квартал',from:ymd(lastQStart),to:ymd(lastQEnd)},
    {key:'prevYear',label:'Попередній рік',from:(y-1)+'-01-01',to:(y-1)+'-12-31'}
  ];
}

function renderValue(field,op,vc){
  vc.innerHTML='';
  if(op==='IS NULL'||op==='IS NOT NULL')return;

  // ---- DATE: two inputs + preset chips ----
  if(field.type==='date'){
    var rangeRow=document.createElement('div');rangeRow.className='date-range-row';
    var d1=document.createElement('input');d1.type='date';d1.className='date-from';
    var sep=document.createElement('span');sep.textContent='—';
    var d2=document.createElement('input');d2.type='date';d2.className='date-to';
    rangeRow.appendChild(d1);rangeRow.appendChild(sep);rangeRow.appendChild(d2);
    var chips=document.createElement('div');chips.className='date-presets';
    datePresets().forEach(function(p){
      var b=document.createElement('button');b.type='button';b.className='date-preset-btn';b.textContent=p.label;
      b.onclick=function(){
        d1.value=p.from;d2.value=p.to;
        chips.querySelectorAll('.date-preset-btn').forEach(function(x){x.classList.remove('active');});
        b.classList.add('active');
      };
      chips.appendChild(b);
    });
    [d1,d2].forEach(function(el){el.oninput=function(){chips.querySelectorAll('.date-preset-btn').forEach(function(x){x.classList.remove('active');});};});
    vc.appendChild(rangeRow);vc.appendChild(chips);return;
  }

  // ---- STATUS: colored pills (single-select) ----
  if(field.field_id===12464 && field.options&&field.options.length){
    var pg=document.createElement('div');pg.className='pill-group';var hidden=document.createElement('input');hidden.type='hidden';hidden.className='pill-value';
    field.options.forEach(function(o){
      var p=document.createElement('button');p.type='button';p.className='pill '+(o.id==='won'?'opt-won':o.id==='lost'?'opt-lost':'opt-open');p.textContent=o.label;p.dataset.val=o.id;
      p.onclick=function(){pg.querySelectorAll('.pill').forEach(function(x){x.classList.remove('active','won','lost','open');});p.classList.add('active');if(o.id==='won')p.classList.add('won');else if(o.id==='lost')p.classList.add('lost');else p.classList.add('open');hidden.value=o.id;};
      pg.appendChild(p);
    });
    vc.appendChild(pg);vc.appendChild(hidden);return;
  }

  // ---- PRODUCT NAME: searchable select ----
  if(field.field_id===12511 && productNames.length){
    var opts=productNames.map(function(n){return {value:n,label:n};});
    vc.appendChild(buildSSel({options:opts,placeholder:'— Оберіть товар —'}));return;
  }

  // ---- ENUM with field.options: searchable select (label if lost_reason) ----
  if(field.options&&field.options.length){
    var labelFields=[12475];
    var useLabel=labelFields.indexOf(field.field_id)>=0;
    var ops=field.options.map(function(o){return {value:useLabel?o.label:o.id,label:o.label};});
    vc.appendChild(buildSSel({options:ops,placeholder:'— Оберіть значення —'}));return;
  }

  // ---- PIPELINE ----
  if(field.type==='pipeline'){
    var ops=pipelines.map(function(p){return {value:p.id,label:p.name};});
    vc.appendChild(buildSSel({options:ops,placeholder:'— Оберіть воронку —'}));return;
  }

  // ---- STAGE (cascaded via optgroup) ----
  if(field.type==='stage'){
    var ops=[];pipelines.forEach(function(p){(stages[p.id]||[]).forEach(function(s){ops.push({value:s.id,label:s.name,group:p.name});});});
    vc.appendChild(buildSSel({options:ops,placeholder:'— Оберіть етап —'}));return;
  }

  // ---- USER (active/inactive groups) ----
  if(field.type==='user'){
    var ops=[];users.filter(function(u){return u.active;}).forEach(function(u){ops.push({value:u.id,label:u.name,group:'Активні'});});
    users.filter(function(u){return !u.active;}).forEach(function(u){ops.push({value:u.id,label:u.name,group:'Неактивні'});});
    vc.appendChild(buildSSel({options:ops,placeholder:'— Оберіть користувача —'}));return;
  }

  // ---- NUMBERS ----
  if(field.type==='int'||field.type==='monetary'){var inp=document.createElement('input');inp.type='number';inp.placeholder=field.type==='monetary'?'0':'';vc.appendChild(inp);return;}

  // ---- DEFAULT: text ----
  var inp=document.createElement('input');inp.type='text';inp.placeholder='Введіть значення...';vc.appendChild(inp);
}
function collectConditions(){
  var conds=[],rows=document.querySelectorAll('.filter-row');
  for(var i=0;i<rows.length;i++){
    var fs=rows[i].querySelector('.field-select');if(!fs)continue;
    var os=rows[i].querySelector('.operator-select');if(!fs.value)continue;
    var fid=parseInt(fs.value);var op=os.value;var field=fields.find(function(f){return f.field_id===fid;});
    if(op==='IS NULL'||op==='IS NOT NULL'){conds.push({field_id:fid,operator:op,value:'',extra_value:null});continue;}
    if(field&&field.type==='date'){
      var d1=rows[i].querySelector('.date-from');var d2=rows[i].querySelector('.date-to');
      if(d1&&d1.value)conds.push({field_id:fid,operator:'>=',value:d1.value,extra_value:null});
      if(d2&&d2.value)conds.push({field_id:fid,operator:'<=',value:d2.value,extra_value:null});
      continue;
    }
    var val='';
    var sselEl=rows[i].querySelector('.value-container .ssel');
    if(sselEl&&typeof sselEl.getValue==='function')val=sselEl.getValue();
    else{
      var hidden=rows[i].querySelector('.value-container .pill-value');
      if(hidden)val=hidden.value;
      else{var inp=rows[i].querySelector('.value-container select, .value-container input');if(inp)val=inp.value;}
    }
    if(val!=='')conds.push({field_id:fid,operator:op,value:val,extra_value:null});
  }
  if(conds.length>16){showError('Максимум 16 умов');return null;}
  if(conds.length===0){showError('Додайте хоча б одну умову');return null;}
  return conds;
}

// ===== REPORT =====
// Map field_id to SQL column name + comparison type
var FIELD_ID_TO_SQL={
  12460:'pipeline_id',12462:'stage_id',12464:'status',12455:'owner_id',12454:'creator_id',
  12465:'add_time',12466:'update_time',12470:'won_time',12473:'lost_time',12474:'close_time',
  12484:'expected_close_date',12456:'value',12453:'title',12463:'label',12475:'lost_reason',
  12459:'org_name',12461:'person_name',12458:'probability',12519:'origin',12521:'channel',
  12497:'c_lead_quality',12504:'c_client_position',12496:'c_source_form',12515:'c_processed',
  12498:'c_transferred_cold',12485:'c_project_name',12493:'c_site_name',12499:'c_utm_source',
  12500:'c_utm_medium',12501:'c_utm_campaign',12502:'c_utm_term',12503:'c_utm_content',
  12508:'c_site_page',12489:'c_comment',12527:'c_kp_link',12512:'c_quality_date',
  12488:'c_control_date',12492:'c_contact_date',12494:'c_utm',12514:'c_phone_webpromo',
  12528:'c_kp_specialist',12529:'c_loss_comment',12511:'title' // product_name search via title
};

function runReport(){
  var selVal=getActivePresetId();
  var pr=selVal?presets.find(function(p){return p.id===selVal;}):null;
  if(pr&&pr.sheetFilters){
    showLoading(true);hideError();document.getElementById('report-section').style.display='none';
    var gb=document.getElementById('group-by').value;
    google.script.run.withSuccessHandler(function(r){showLoading(false);if(r.error){showError(r.error);return;}lastData=r;renderReport(r);}).withFailureHandler(function(e){showLoading(false);showError(e.message);}).buildReportFromDB(pr.sheetFilters,gb);
    return;
  }
  window._presetColumns=null;
  var c=collectConditions();if(!c)return;showLoading(true);hideError();
  document.getElementById('report-section').style.display='none';
  // Convert field_id conditions to SQL filters
  var dbFilters=c.map(function(cond){
    var col=FIELD_ID_TO_SQL[cond.field_id];if(!col)return null;
    var opMap={'=':'=','!=':'!=','>=':'>=','<=':'<=','>':'>','<':'<','LIKE':'contains','IS NULL':'is null','IS NOT NULL':'is not null'};
    // Special case: product_name (12511) -> JOIN with deal_products
    if(cond.field_id===12511)return {field:'product_name',op:'=',value:cond.value};
    return {field:col,op:opMap[cond.operator]||'=',value:cond.value};
  }).filter(function(x){return x;});
  var gb=document.getElementById('group-by').value;
  google.script.run.withSuccessHandler(function(r){showLoading(false);if(r.error){showError(r.error);return;}if(r._debug){document.getElementById('debug-filters').textContent=JSON.stringify(r._debug.inputFilters,null,2);document.getElementById('debug-sql').textContent=r._debug.sql;document.getElementById('debug-count').textContent='Знайдено угод: '+r._debug.dealsCount;document.getElementById('debug-modal').style.display='flex';}lastData=r;renderReport(r);}).withFailureHandler(function(e){showLoading(false);showError(e.message);}).buildReportFromDB(dbFilters,gb);
}

function renderReport(r){
  document.getElementById('report-section').style.display='block';
  renderSummary(r.totals);
  if(r.charts)renderCharts(r.charts);
  renderGroups(r.groups);
  renderTable(r.deals);
  var id=getActivePresetId();
  var preset=id?presets.find(function(p){return p.id===id;}):null;
  if(preset&&preset.enhanced){renderEnhancedCharts(r.deals||[],r.totals||{},preset);}
  else{hideEnhancedCharts();}
}

function hideEnhancedCharts(){
  document.getElementById('kpi-extra-cards').style.display='none';
  ['chart-funnel','chart-loss-reasons','chart-monthly-trend','chart-conv-manager','chart-heatmap'].forEach(function(id){
    document.getElementById(id).style.display='none';
  });
}

function renderEnhancedCharts(deals,totals,preset){
  renderKpiExtra(deals,totals);
  google.charts.setOnLoadCallback(function(){
    renderFunnel(deals,preset);
    renderLossReasons(deals);
    renderMonthlyTrend(deals);
    renderConvByManager(deals);
    renderHeatmapStageManager(deals,preset);
  });
}

function renderKpiExtra(deals,t){
  var pipelineSum=0,wonCount=0,wonSum=0,weightedForecast=0;
  deals.forEach(function(d){
    var v=parseFloat(d.value)||0;
    if(d.status==='open'){pipelineSum+=v;weightedForecast+=v*((parseFloat(d.probability)||0)/100);}
    if(d.status==='won'){wonCount++;wonSum+=v;}
  });
  var avgCheck=wonCount>0?Math.round(wonSum/wonCount):0;
  var el=document.getElementById('kpi-extra-cards');
  el.innerHTML=
    '<div class="card kpi-pipeline"><div class="num">'+formatMoney(pipelineSum)+'</div><div class="lbl">Сума в pipeline</div></div>'+
    '<div class="card kpi-avg"><div class="num">'+formatMoney(avgCheck)+'</div><div class="lbl">Середній чек (виграні)</div></div>'+
    '<div class="card kpi-forecast"><div class="num">'+formatMoney(Math.round(weightedForecast))+'</div><div class="lbl">Прогноз (probability × pipeline)</div></div>';
  el.style.display='flex';
}

function renderFunnel(deals,preset){
  var box=document.getElementById('chart-funnel');
  var stages=(preset&&preset.funnelStages)||[];
  if(!stages.length){box.style.display='none';return;}
  var counts={};stages.forEach(function(s){counts[s.id]={open:0,won:0,lost:0};});
  deals.forEach(function(d){if(counts[d.stage_id])counts[d.stage_id][d.status]=(counts[d.stage_id][d.status]||0)+1;});
  var dt=new google.visualization.DataTable();
  dt.addColumn('string','Етап');dt.addColumn('number','Відкриті');dt.addColumn('number','Виграні');dt.addColumn('number','Програні');
  stages.forEach(function(s){var c=counts[s.id];dt.addRow([s.name,c.open||0,c.won||0,c.lost||0]);});
  box.innerHTML='<div class="chart-title">Воронка КП по етапах</div><div id="chart-funnel-canvas" style="height:320px"></div>';
  box.style.display='block';
  new google.visualization.ColumnChart(document.getElementById('chart-funnel-canvas')).draw(dt,{
    isStacked:true,legend:{position:'top'},colors:['#3498db','#27ae60','#e74c3c'],
    chartArea:{width:'85%',height:'70%'},hAxis:{slantedText:true,slantedTextAngle:25}
  });
}

var _lossDealsCache={};
function renderLossReasons(deals){
  var box=document.getElementById('chart-loss-reasons');
  var lost=deals.filter(function(d){return d.status==='lost';});
  if(!lost.length){box.style.display='none';return;}
  var byReason={};_lossDealsCache={};
  lost.forEach(function(d){
    var r=d.lost_reason||'(не вказано)';
    byReason[r]=(byReason[r]||0)+1;
    if(!_lossDealsCache[r])_lossDealsCache[r]=[];
    _lossDealsCache[r].push(d);
  });
  var dt=new google.visualization.DataTable();dt.addColumn('string','Причина');dt.addColumn('number','Угод');
  Object.keys(byReason).forEach(function(k){dt.addRow([k,byReason[k]]);});
  box.innerHTML='<div class="chart-title">Причини програшу (клік — коментарі)</div><div id="chart-loss-canvas" style="height:320px;cursor:pointer"></div>';
  box.style.display='block';
  var chart=new google.visualization.PieChart(document.getElementById('chart-loss-canvas'));
  chart.draw(dt,{pieHole:0.4,chartArea:{width:'90%',height:'80%'},legend:{position:'right',textStyle:{fontSize:11}}});
  google.visualization.events.addListener(chart,'select',function(){
    var sel=chart.getSelection();if(!sel.length)return;
    var reason=dt.getValue(sel[0].row,0);showLossComments(reason);
  });
}

function showLossComments(reason){
  var dl=_lossDealsCache[reason]||[];
  document.getElementById('loss-comments-title').textContent='Програні КП: '+reason+' ('+dl.length+')';
  document.getElementById('loss-comments-list').innerHTML=dl.map(function(d){
    var title=esc(d.title||'(без назви)');
    var comment=d.c_loss_comment?esc(d.c_loss_comment):'<em style="color:#aaa">коментар не заповнений</em>';
    var owner=esc(d.owner_name||'');var val=formatMoney(d.value);
    return '<div class="loss-comment-item"><div class="deal-title"><a href="https://webpromo.pipedrive.com/deal/'+d.id+'" target="_blank">'+title+'</a></div><div class="comment-text">'+comment+'</div><div class="meta">'+owner+' · '+val+'</div></div>';
  }).join('')||'<p style="color:#888">Немає угод</p>';
  document.getElementById('loss-comments-modal').style.display='flex';
}

function renderMonthlyTrend(deals){
  var box=document.getElementById('chart-monthly-trend');
  var months={};
  deals.forEach(function(d){
    if(!d.add_time)return;
    var m=String(d.add_time).substring(0,7);
    if(!months[m])months[m]={created:0,won:0,lost:0};
    months[m].created++;
    if(d.status==='won')months[m].won++;
    else if(d.status==='lost')months[m].lost++;
  });
  var keys=Object.keys(months).sort();
  if(!keys.length){box.style.display='none';return;}
  var dt=new google.visualization.DataTable();
  dt.addColumn('string','Місяць');dt.addColumn('number','Створено');dt.addColumn('number','Виграно');dt.addColumn('number','Програно');
  keys.forEach(function(k){var m=months[k];dt.addRow([k,m.created,m.won,m.lost]);});
  box.innerHTML='<div class="chart-title">Динаміка КП по місяцях</div><div id="chart-monthly-canvas" style="height:320px"></div>';
  box.style.display='block';
  new google.visualization.LineChart(document.getElementById('chart-monthly-canvas')).draw(dt,{
    colors:['#333','#27ae60','#e74c3c'],legend:{position:'top'},
    chartArea:{width:'88%',height:'72%'},pointSize:5,curveType:'function'
  });
}

function renderConvByManager(deals){
  var box=document.getElementById('chart-conv-manager');
  var byMgr={};
  deals.forEach(function(d){
    var n=d.owner_name||'(не вказано)';
    if(!byMgr[n])byMgr[n]={total:0,won:0,lost:0,open:0};
    byMgr[n].total++;byMgr[n][d.status]=(byMgr[n][d.status]||0)+1;
  });
  var rows=Object.keys(byMgr).map(function(k){var m=byMgr[k];m.name=k;m.winRate=m.total>0?Math.round(m.won/m.total*100):0;return m;}).sort(function(a,b){return b.total-a.total;});
  if(!rows.length){box.style.display='none';return;}
  var dt=new google.visualization.DataTable();
  dt.addColumn('string','Менеджер');dt.addColumn('number','Виграні');dt.addColumn('number','Програні');dt.addColumn('number','Відкриті');dt.addColumn({type:'string',role:'annotation'});
  rows.forEach(function(m){dt.addRow([m.name,m.won,m.lost,m.open,m.winRate+'%']);});
  box.innerHTML='<div class="chart-title">Конверсія по менеджерах (win-rate %)</div><div id="chart-mgr-canvas" style="height:360px"></div>';
  box.style.display='block';
  new google.visualization.ColumnChart(document.getElementById('chart-mgr-canvas')).draw(dt,{
    isStacked:true,colors:['#27ae60','#e74c3c','#3498db'],legend:{position:'top'},
    chartArea:{width:'85%',height:'65%'},hAxis:{slantedText:true,slantedTextAngle:30},
    annotations:{alwaysOutside:true,textStyle:{fontSize:11,color:'#333'}}
  });
}

function renderHeatmapStageManager(deals,preset){
  var box=document.getElementById('chart-heatmap');
  var stages=(preset&&preset.funnelStages)||[];
  if(!stages.length){box.style.display='none';return;}
  var mgrs={};
  deals.forEach(function(d){var n=d.owner_name||'(не вказано)';if(!mgrs[n])mgrs[n]={};mgrs[n][d.stage_id]=(mgrs[n][d.stage_id]||0)+1;});
  var mgrList=Object.keys(mgrs).sort(function(a,b){
    var ta=0,tb=0;stages.forEach(function(s){ta+=mgrs[a][s.id]||0;tb+=mgrs[b][s.id]||0;});
    return tb-ta;
  });
  if(!mgrList.length){box.style.display='none';return;}
  var max=0;mgrList.forEach(function(m){stages.forEach(function(s){var v=mgrs[m][s.id]||0;if(v>max)max=v;});});
  var html='<div class="chart-title">Карта: Менеджер × Етап (де застрягли КП)</div><div style="overflow-x:auto"><table class="heatmap-table"><thead><tr><th>Менеджер</th>';
  stages.forEach(function(s){html+='<th>'+esc(s.name)+'</th>';});html+='<th>Всього</th></tr></thead><tbody>';
  mgrList.forEach(function(m){
    html+='<tr><td class="mgr">'+esc(m)+'</td>';var total=0;
    stages.forEach(function(s){
      var v=mgrs[m][s.id]||0;total+=v;
      var bg=heatColor(v,max);
      html+='<td class="cell" style="background:'+bg+'">'+(v||'')+'</td>';
    });
    html+='<td class="mgr">'+total+'</td></tr>';
  });
  html+='</tbody></table></div><div class="heatmap-legend">Чим темніша клітинка — тим більше КП у менеджера на цьому етапі</div>';
  box.innerHTML=html;box.style.display='block';
}

function heatColor(v,max){
  if(!v||max<=0)return '#fff';
  var t=v/max;var r=Math.round(255-(255-49)*t),g=Math.round(255-(255-122)*t),b=Math.round(255-(255-226)*t);
  return 'rgb('+r+','+g+','+b+')';
}

function renderSummary(t){
  document.getElementById('summary-cards').innerHTML=
    '<div class="card"><div class="num">'+t.total+'</div><div class="lbl">Всього угод</div></div>'+
    '<div class="card won"><div class="num">'+t.won+' ('+t.conversion_rate+'%)</div><div class="lbl">Виграно</div></div>'+
    '<div class="card lost"><div class="num">'+t.lost+'</div><div class="lbl">Програно</div></div>'+
    '<div class="card open"><div class="num">'+t.open+'</div><div class="lbl">Відкриті</div></div>'+
    '<div class="card"><div class="num">'+formatMoney(t.won_value)+'</div><div class="lbl">Сума виграних</div></div>'+
    '<div class="card"><div class="num">'+formatMoney(t.open_value)+'</div><div class="lbl">Сума відкритих</div></div>';
}

function renderCharts(ch){
  google.charts.setOnLoadCallback(function(){
    if(ch.convByOwner&&ch.convByOwner.length){
      var dt=new google.visualization.DataTable();dt.addColumn('string','Менеджер');dt.addColumn('number','Won');dt.addColumn('number','Lost');dt.addColumn('number','Open');
      ch.convByOwner.forEach(function(o){dt.addRow([o.name,o.won,o.lost,o.open]);});
      new google.visualization.ColumnChart(document.getElementById('chart-owners')).draw(dt,{title:'Конверсія по менеджерах',isStacked:true,colors:['#27ae60','#e74c3c','#3498db'],legend:{position:'top'},height:350,chartArea:{width:'80%'}});
    }
    if(ch.dealsByMonth&&ch.dealsByMonth.length){
      var dt2=new google.visualization.DataTable();dt2.addColumn('string','Місяць');dt2.addColumn('number','Всього');dt2.addColumn('number','Won');dt2.addColumn('number','Lost');
      ch.dealsByMonth.forEach(function(m){dt2.addRow([m.month,m.total,m.won,m.lost]);});
      new google.visualization.LineChart(document.getElementById('chart-months')).draw(dt2,{title:'Динаміка по місяцях',colors:['#333','#27ae60','#e74c3c'],legend:{position:'top'},height:350,chartArea:{width:'80%'}});
    }
    if(ch.dealsByPipeline&&ch.dealsByPipeline.length){
      var dt3=new google.visualization.DataTable();dt3.addColumn('string','Воронка');dt3.addColumn('number','Угод');
      ch.dealsByPipeline.forEach(function(p){dt3.addRow([p.name,p.count]);});
      new google.visualization.PieChart(document.getElementById('chart-pipelines')).draw(dt3,{title:'Розподіл по воронках',height:350,chartArea:{width:'90%'}});
    }
  });
}

function renderGroups(groups){var c=document.getElementById('group-tables');c.innerHTML='';if(!groups||!groups.length)return;groups.forEach(function(g,i){c.innerHTML+='<div class="group-section"><div class="group-header" onclick="toggleGroup('+i+')"><span class="group-name">'+g.name+'</span><span class="group-stats">'+g.total+' угод | '+formatMoney(g.value)+' | Конверсія: '+g.conversion_rate+'%</span></div><div class="group-body" id="gb-'+i+'"></div></div>';});}
function toggleGroup(i){document.getElementById('gb-'+i).classList.toggle('open');}

// ===== TABLE =====
var TABLE_COLS=[
  {key:'title',label:'Назва',link:true},{key:'owner_name',label:'Власник'},{key:'pipeline_name',label:'Воронка'},
  {key:'stage_name',label:'Етап'},{key:'status',label:'Стан',badge:true},{key:'value',label:'Вартість',money:true},
  {key:'add_time',label:'Дата створення',date:true},{key:'label',label:'Мітка'},
  {key:'lost_reason',label:'Причина програшу'},{key:'person_name',label:'Контакт'},{key:'org_name',label:'Організація'}
];

function getActiveCols(){return window._presetColumns||TABLE_COLS;}

function renderTable(deals){
  var cols=getActiveCols();
  document.getElementById('deals-thead').innerHTML='<tr>'+cols.map(function(c){return '<th onclick="sortTable(\''+c.key+'\')">'+c.label+'<span class="sort-icon" id="si-'+c.key+'"></span></th>';}).join('')+'</tr>';
  fillTableBody(deals);
}
function fillTableBody(deals){
  var cols=getActiveCols();
  document.getElementById('deals-tbody').innerHTML=deals.map(function(d){
    return '<tr>'+cols.map(function(c){
      var v=d[c.key]||'';
      if(c.key==='title')return '<td><a href="https://webpromo.pipedrive.com/deal/'+d.id+'" target="_blank">'+esc(v)+'</a></td>';
      if(c.link&&v)return '<td><a href="'+esc(v)+'" target="_blank">Відкрити</a></td>';
      if(c.stage&&d.stage_name)return '<td>'+esc(d.stage_name)+'</td>';
      if(c.badge)return '<td><span class="status-badge status-'+v+'">'+statusLabel(v)+'</span></td>';
      if(c.money)return '<td style="text-align:right">'+formatMoney(v)+'</td>';
      if(c.date)return '<td>'+formatDate(v)+'</td>';
      return '<td>'+esc(String(v))+'</td>';
    }).join('')+'</tr>';
  }).join('');
}
function sortTable(col){
  if(sortCol===col)sortDir=sortDir==='asc'?'desc':'asc';else{sortCol=col;sortDir='asc';}
  document.querySelectorAll('.sort-icon').forEach(function(s){s.textContent='';});
  var icon=document.getElementById('si-'+col);if(icon)icon.textContent=sortDir==='asc'?' ▲':' ▼';
  lastData.deals.sort(function(a,b){var va=a[col]||'',vb=b[col]||'';if(typeof va==='number')return sortDir==='asc'?va-vb:vb-va;return sortDir==='asc'?String(va).localeCompare(String(vb)):String(vb).localeCompare(String(va));});
  fillTableBody(lastData.deals);
}

function formatMoney(v){if(v===null||v===undefined||v==='')return'—';return new Intl.NumberFormat('uk-UA',{maximumFractionDigits:0}).format(Number(v));}
function formatDate(s){if(!s)return'';var d=new Date(s);return d.toLocaleDateString('uk-UA');}
function statusLabel(s){return s==='won'?'Виграна':s==='lost'?'Програна':s==='open'?'Відкрита':s;}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function showLoading(v){document.getElementById('loading').style.display=v?'block':'none';}
function showError(m){document.getElementById('error-bar').style.display='block';document.getElementById('error-bar').textContent=m;}
function hideError(){document.getElementById('error-bar').style.display='none';}
</script>
