<script>
var fields=[],pipelines=[],users=[],stages={},opLabels={},presets=[],lastData=null,sortCol=null,sortDir='asc';
window._presetOrConditions=[];window._presetColumns=null;

google.charts.load('current',{packages:['corechart','bar']});

document.addEventListener('DOMContentLoaded',function(){
  google.script.run.withSuccessHandler(function(f){fields=f;addFilterRow();}).getFieldsConfig();
  google.script.run.withSuccessHandler(function(p){pipelines=p;}).getPipelinesConfig();
  google.script.run.withSuccessHandler(function(u){users=u;}).getUsersConfig();
  google.script.run.withSuccessHandler(function(s){stages=s;}).getAllStages();
  google.script.run.withSuccessHandler(function(o){opLabels=o;}).getOperatorsLabels();
  google.script.run.withSuccessHandler(function(p){presets=p;initPresets();}).getPresetReports();
  var y=new Date().getFullYear();
  document.getElementById('date-from').value=y+'-01-01';
  document.getElementById('date-to').value=y+'-12-31';
});

// ===== SYNC MODAL =====
function refreshData(){
  var df=document.getElementById('date-from').value;
  var dt=document.getElementById('date-to').value;
  if(!df||!dt){showError('Оберіть період');return;}
  document.getElementById('sync-modal').style.display='flex';
  document.getElementById('sync-progress').style.display='block';
  document.getElementById('sync-result').style.display='none';
  google.script.run.withSuccessHandler(function(r){
    document.getElementById('sync-progress').style.display='none';
    document.getElementById('sync-result').style.display='block';
    if(r.error){
      document.getElementById('sync-result-icon').textContent='❌';
      document.getElementById('sync-result-title').textContent='Помилка синхронізації';
      document.getElementById('sync-result-table').innerHTML='<p style="color:#c00">'+r.error+'</p>';
      return;
    }
    var results=r.results||[];
    var totalAll=results.reduce(function(s,x){return s+x.inserted;},0);
    var errAll=results.reduce(function(s,x){return s+x.errors;},0);
    var elapsed=results.reduce(function(s,x){return s+(x.elapsed||0);},0);
    document.getElementById('sync-result-icon').textContent=errAll>0?'⚠️':'✅';
    document.getElementById('sync-result-title').textContent=totalAll.toLocaleString('uk-UA')+' записів синхронізовано';
    var html='<table><tr><th>Сутність</th><th>Записів</th><th>Успіх</th></tr>';
    results.forEach(function(res){
      var pct=res.total>0?(res.inserted/res.total*100).toFixed(res.errors>0?2:0)+'%':'—';
      var cls=res.errors>0?'error':'success';
      var cnt=res.errors>0?res.inserted+'/'+res.total:res.total.toLocaleString('uk-UA');
      html+='<tr><td>'+res.entity+'</td><td>'+cnt+'</td><td class="'+cls+'">'+pct+'</td></tr>';
    });
    html+='</table>';
    document.getElementById('sync-result-table').innerHTML=html;
    document.getElementById('sync-result-time').textContent='Час: '+Math.floor(elapsed/60)+'хв '+elapsed%60+'с';
  }).withFailureHandler(function(e){
    document.getElementById('sync-progress').style.display='none';
    document.getElementById('sync-result').style.display='block';
    document.getElementById('sync-result-icon').textContent='❌';
    document.getElementById('sync-result-title').textContent='Помилка';
    document.getElementById('sync-result-table').innerHTML='<p>'+e.message+'</p>';
  }).refreshAllData(df,dt);
}
function closeSyncModal(){document.getElementById('sync-modal').style.display='none';}

// ===== PRESETS =====
function initPresets(){
  var sel=document.getElementById('preset-select');
  presets.forEach(function(p){var o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.appendChild(o);});
  sel.onchange=function(){
    if(!this.value)return;
    var pr=presets.find(function(p){return p.id===sel.value;});
    if(!pr)return;
    document.getElementById('filter-rows').innerHTML='';
    window._presetOrConditions=pr.orConditions||[];
    window._presetColumns=pr.columns||null;
    window._presetSheetFilters=pr.sheetFilters||null;
    if(pr.andConditions)pr.andConditions.forEach(function(f){addFilterRowWithData(f);});
    if(pr.orConditions)pr.orConditions.forEach(function(f){addFilterRowWithData(f);});
    if(pr.filters)pr.filters.forEach(function(f){addFilterRowWithData(f);});
  };
}

// ===== FILTER ROWS =====
function addFilterRow(){window._presetOrConditions=[];window._presetColumns=null;window._presetSheetFilters=null;
  var div=document.createElement('div');div.className='filter-row';
  var fs=document.createElement('select');fs.className='field-select';
  var def=document.createElement('option');def.value='';def.textContent='— Оберіть поле —';fs.appendChild(def);
  fields.forEach(function(f){var o=document.createElement('option');o.value=f.field_id;o.textContent=f.label;fs.appendChild(o);});
  var os=document.createElement('select');os.className='operator-select';os.disabled=true;
  var vc=document.createElement('div');vc.className='value-container';
  var rb=document.createElement('button');rb.className='btn-remove';rb.innerHTML='&times;';rb.onclick=function(){div.remove();};
  fs.onchange=function(){onFieldChange(div,fs,os,vc);};
  div.appendChild(fs);div.appendChild(os);div.appendChild(vc);div.appendChild(rb);
  document.getElementById('filter-rows').appendChild(div);
}
function addFilterRowWithData(data){
  addFilterRow();var rows=document.querySelectorAll('.filter-row');var row=rows[rows.length-1];
  var fs=row.querySelector('.field-select');fs.value=data.field_id;fs.onchange();
  var os=row.querySelector('.operator-select');os.value=data.operator;if(os.onchange)os.onchange();
  var vc=row.querySelector('.value-container');var inp=vc.querySelector('select,input');
  if(inp)inp.value=data.value;
}
function onFieldChange(row,fs,os,vc){
  var fid=parseInt(fs.value);var field=fields.find(function(f){return f.field_id===fid;});
  os.innerHTML='';os.disabled=false;vc.innerHTML='';
  if(!field){os.disabled=true;return;}
  field.operators.forEach(function(op){var o=document.createElement('option');o.value=op;o.textContent=opLabels[op]||op;os.appendChild(o);});
  os.onchange=function(){renderValue(field,os.value,vc);};
  renderValue(field,field.operators[0],vc);
}
function renderValue(field,op,vc){
  vc.innerHTML='';
  if(op==='IS NULL'||op==='IS NOT NULL')return;
  if(field.type==='date'){var d1=document.createElement('input');d1.type='date';d1.className='date-from';var d2=document.createElement('input');d2.type='date';d2.className='date-to';vc.appendChild(d1);vc.appendChild(d2);return;}
  if(field.options&&field.options.length){var sel=document.createElement('select');field.options.forEach(function(o){var opt=document.createElement('option');opt.value=o.id;opt.textContent=o.label;sel.appendChild(opt);});vc.appendChild(sel);return;}
  if(field.type==='pipeline'){var sel=document.createElement('select');pipelines.forEach(function(p){var o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.appendChild(o);});vc.appendChild(sel);return;}
  if(field.type==='stage'){var sel=document.createElement('select');pipelines.forEach(function(p){var og=document.createElement('optgroup');og.label=p.name;(stages[p.id]||[]).forEach(function(s){var o=document.createElement('option');o.value=s.id;o.textContent=s.name;og.appendChild(o);});sel.appendChild(og);});vc.appendChild(sel);return;}
  if(field.type==='user'){var sel=document.createElement('select');var ag=document.createElement('optgroup');ag.label='Активні';var ig=document.createElement('optgroup');ig.label='Неактивні';users.forEach(function(u){var o=document.createElement('option');o.value=u.id;o.textContent=u.name;(u.active?ag:ig).appendChild(o);});sel.appendChild(ag);sel.appendChild(ig);vc.appendChild(sel);return;}
  if(field.type==='int'||field.type==='monetary'){var inp=document.createElement('input');inp.type='number';vc.appendChild(inp);return;}
  var inp=document.createElement('input');inp.type='text';inp.placeholder='Введіть значення...';vc.appendChild(inp);
}
function collectConditions(){
  var conds=[],rows=document.querySelectorAll('.filter-row');
  for(var i=0;i<rows.length;i++){
    var fs=rows[i].querySelector('.field-select');if(!fs)continue;
    var os=rows[i].querySelector('.operator-select');if(!fs.value)continue;
    var fid=parseInt(fs.value);var op=os.value;var field=fields.find(function(f){return f.field_id===fid;});
    if(op==='IS NULL'||op==='IS NOT NULL'){conds.push({field_id:fid,operator:op,value:'',extra_value:null});continue;}
    if(field&&field.type==='date'){var d1=rows[i].querySelector('.date-from');var d2=rows[i].querySelector('.date-to');if(d1&&d1.value)conds.push({field_id:fid,operator:'>=',value:d1.value,extra_value:null});if(d2&&d2.value)conds.push({field_id:fid,operator:'<=',value:d2.value,extra_value:null});continue;}
    var inp=rows[i].querySelector('.value-container select, .value-container input');
    if(inp&&inp.value)conds.push({field_id:fid,operator:op,value:inp.value,extra_value:null});
  }
  if(conds.length>16){showError('Максимум 16 умов');return null;}
  if(conds.length===0){showError('Додайте хоча б одну умову');return null;}
  return conds;
}

// ===== REPORT =====
function runReport(){
  var selVal=document.getElementById('preset-select').value;
  var pr=selVal?presets.find(function(p){return p.id===selVal;}):null;
  if(pr&&pr.sheetFilters){
    showLoading(true);hideError();
    document.getElementById('report-section').style.display='none';
    var gb=document.getElementById('group-by').value;
    google.script.run.withSuccessHandler(function(r){showLoading(false);if(r.error){showError(r.error);return;}lastData=r;renderReport(r);}).withFailureHandler(function(e){showLoading(false);showError(e.message);}).buildReportFromDB(pr.sheetFilters,gb);
    return;
  }
  window._presetColumns=null;
  var c=collectConditions();if(!c)return;showLoading(true);hideError();
  document.getElementById('report-section').style.display='none';
  var gb=document.getElementById('group-by').value;var orC=window._presetOrConditions||[];
  google.script.run.withSuccessHandler(function(r){showLoading(false);if(r.error){showError(r.error);return;}lastData=r;renderReport(r);}).withFailureHandler(function(e){showLoading(false);showError(e.message);}).buildAndFetchReport(c,gb,orC);
}

function renderReport(r){
  document.getElementById('report-section').style.display='block';
  renderSummary(r.totals);
  if(r.charts)renderCharts(r.charts);
  renderGroups(r.groups);
  renderTable(r.deals);
}

function renderSummary(t){
  document.getElementById('summary-cards').innerHTML=
    '<div class="card"><div class="num">'+t.total+'</div><div class="lbl">Всього угод</div></div>'+
    '<div class="card won"><div class="num">'+t.won+' ('+t.conversion_rate+'%)</div><div class="lbl">Виграно</div></div>'+
    '<div class="card lost"><div class="num">'+t.lost+'</div><div class="lbl">Програно</div></div>'+
    '<div class="card open"><div class="num">'+t.open+'</div><div class="lbl">Відкриті</div></div>'+
    '<div class="card"><div class="num">'+formatMoney(t.won_value)+'</div><div class="lbl">Сума виграних</div></div>'+
    '<div class="card"><div class="num">'+formatMoney(t.open_value)+'</div><div class="lbl">Сума відкритих</div></div>';
}

function renderCharts(ch){
  google.charts.setOnLoadCallback(function(){
    if(ch.convByOwner&&ch.convByOwner.length){
      var dt=new google.visualization.DataTable();dt.addColumn('string','Менеджер');dt.addColumn('number','Won');dt.addColumn('number','Lost');dt.addColumn('number','Open');
      ch.convByOwner.forEach(function(o){dt.addRow([o.name,o.won,o.lost,o.open]);});
      new google.visualization.ColumnChart(document.getElementById('chart-owners')).draw(dt,{title:'Конверсія по менеджерах',isStacked:true,colors:['#27ae60','#e74c3c','#3498db'],legend:{position:'top'},height:350,chartArea:{width:'80%'}});
    }
    if(ch.dealsByMonth&&ch.dealsByMonth.length){
      var dt2=new google.visualization.DataTable();dt2.addColumn('string','Місяць');dt2.addColumn('number','Всього');dt2.addColumn('number','Won');dt2.addColumn('number','Lost');
      ch.dealsByMonth.forEach(function(m){dt2.addRow([m.month,m.total,m.won,m.lost]);});
      new google.visualization.LineChart(document.getElementById('chart-months')).draw(dt2,{title:'Динаміка по місяцях',colors:['#333','#27ae60','#e74c3c'],legend:{position:'top'},height:350,chartArea:{width:'80%'}});
    }
    if(ch.dealsByPipeline&&ch.dealsByPipeline.length){
      var dt3=new google.visualization.DataTable();dt3.addColumn('string','Воронка');dt3.addColumn('number','Угод');
      ch.dealsByPipeline.forEach(function(p){dt3.addRow([p.name,p.count]);});
      new google.visualization.PieChart(document.getElementById('chart-pipelines')).draw(dt3,{title:'Розподіл по воронках',height:350,chartArea:{width:'90%'}});
    }
  });
}

function renderGroups(groups){var c=document.getElementById('group-tables');c.innerHTML='';if(!groups||!groups.length)return;groups.forEach(function(g,i){c.innerHTML+='<div class="group-section"><div class="group-header" onclick="toggleGroup('+i+')"><span class="group-name">'+g.name+'</span><span class="group-stats">'+g.total+' угод | '+formatMoney(g.value)+' | Конверсія: '+g.conversion_rate+'%</span></div><div class="group-body" id="gb-'+i+'"></div></div>';});}
function toggleGroup(i){document.getElementById('gb-'+i).classList.toggle('open');}

// ===== TABLE =====
var TABLE_COLS=[
  {key:'title',label:'Назва',link:true},{key:'owner_name',label:'Власник'},{key:'pipeline_name',label:'Воронка'},
  {key:'stage_name',label:'Етап'},{key:'status',label:'Стан',badge:true},{key:'value',label:'Вартість',money:true},
  {key:'add_time',label:'Дата створення',date:true},{key:'label',label:'Мітка'},
  {key:'lost_reason',label:'Причина програшу'},{key:'person_name',label:'Контакт'},{key:'org_name',label:'Організація'}
];

function getActiveCols(){return window._presetColumns||TABLE_COLS;}

function renderTable(deals){
  var cols=getActiveCols();
  document.getElementById('deals-thead').innerHTML='<tr>'+cols.map(function(c){return '<th onclick="sortTable(\''+c.key+'\')">'+c.label+'<span class="sort-icon" id="si-'+c.key+'"></span></th>';}).join('')+'</tr>';
  fillTableBody(deals);
}
function fillTableBody(deals){
  var cols=getActiveCols();
  document.getElementById('deals-tbody').innerHTML=deals.map(function(d){
    return '<tr>'+cols.map(function(c){
      var v=d[c.key]||'';
      if(c.key==='title')return '<td><a href="https://webpromo.pipedrive.com/deal/'+d.id+'" target="_blank">'+esc(v)+'</a></td>';
      if(c.link&&v)return '<td><a href="'+esc(v)+'" target="_blank">Відкрити</a></td>';
      if(c.stage&&d.stage_name)return '<td>'+esc(d.stage_name)+'</td>';
      if(c.badge)return '<td><span class="status-badge status-'+v+'">'+statusLabel(v)+'</span></td>';
      if(c.money)return '<td style="text-align:right">'+formatMoney(v)+'</td>';
      if(c.date)return '<td>'+formatDate(v)+'</td>';
      return '<td>'+esc(String(v))+'</td>';
    }).join('')+'</tr>';
  }).join('');
}
function sortTable(col){
  if(sortCol===col)sortDir=sortDir==='asc'?'desc':'asc';else{sortCol=col;sortDir='asc';}
  document.querySelectorAll('.sort-icon').forEach(function(s){s.textContent='';});
  var icon=document.getElementById('si-'+col);if(icon)icon.textContent=sortDir==='asc'?' ▲':' ▼';
  lastData.deals.sort(function(a,b){var va=a[col]||'',vb=b[col]||'';if(typeof va==='number')return sortDir==='asc'?va-vb:vb-va;return sortDir==='asc'?String(va).localeCompare(String(vb)):String(vb).localeCompare(String(va));});
  fillTableBody(lastData.deals);
}

function formatMoney(v){if(!v&&v!==0)return'';return new Intl.NumberFormat('uk-UA',{maximumFractionDigits:0}).format(v);}
function formatDate(s){if(!s)return'';var d=new Date(s);return d.toLocaleDateString('uk-UA');}
function statusLabel(s){return s==='won'?'Виграна':s==='lost'?'Програна':s==='open'?'Відкрита':s;}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function showLoading(v){document.getElementById('loading').style.display=v?'block':'none';}
function showError(m){document.getElementById('error-bar').style.display='block';document.getElementById('error-bar').textContent=m;}
function hideError(){document.getElementById('error-bar').style.display='none';}
</script>
