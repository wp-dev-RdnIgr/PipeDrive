<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f6f8;color:#333;font-size:14px}
#app{max-width:1400px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
header h1{font-size:20px;font-weight:600}
#presets{display:flex;align-items:center;gap:8px}
#presets label{font-size:13px;color:#666}
#preset-select{padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px}
#filter-panel{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
#filter-panel h2{font-size:15px;margin-bottom:12px;color:#555}
.filter-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.filter-row select,.filter-row input{padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px}
.field-select{width:210px}.operator-select{width:150px}
.value-container{flex:1;min-width:150px;display:flex;gap:4px}
.value-container input,.value-container select{width:100%}
.btn-remove{width:28px;height:28px;border-radius:50%;border:1px solid #e0e0e0;background:#fff;color:#c00;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.btn-remove:hover{background:#fee}
.filter-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px}
.right-actions{display:flex;gap:8px;align-items:center}
#btn-add{background:none;border:1px dashed #aaa;padding:6px 14px;border-radius:4px;cursor:pointer;color:#555;font-size:13px}
#btn-add:hover{border-color:#317ae2;color:#317ae2}
#btn-count{padding:8px 16px;border:1px solid #317ae2;background:#fff;color:#317ae2;border-radius:4px;cursor:pointer;font-size:13px}
.primary{background:#317ae2;color:#fff;border:none;padding:8px 20px;border-radius:4px;cursor:pointer;font-size:14px;font-weight:500}
.primary:hover{background:#2563b8}
#group-by{padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px}
#loading{text-align:center;padding:40px;color:#888}
.spinner{width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#317ae2;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#error-bar{background:#fef0f0;border:1px solid #f5c6c6;border-radius:6px;padding:12px 16px;color:#c00;margin-bottom:16px}
#count-bar{background:#f0f7ff;border:1px solid #b8d4f0;border-radius:6px;padding:12px 16px;color:#1a5276;margin-bottom:16px;font-weight:500}
#summary-cards{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card{background:#fff;border-radius:8px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,0,0,.08);min-width:140px;flex:1}
.card .num{font-size:24px;font-weight:700;color:#333}.card .lbl{font-size:12px;color:#888;margin-top:2px}
.card.won .num{color:#27ae60}.card.lost .num{color:#e74c3c}.card.open .num{color:#317ae2}
.table-wrap{overflow-x:auto}
#deals-table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:13px}
#deals-table th{background:#f8f9fa;padding:8px 10px;text-align:left;font-weight:600;border-bottom:2px solid #e0e0e0;cursor:pointer;white-space:nowrap;position:sticky;top:0;z-index:1}
#deals-table th:hover{background:#eef1f5}
#deals-table td{padding:7px 10px;border-bottom:1px solid #eee}
#deals-table tr:nth-child(even){background:#fafbfc}
#deals-table tr:hover{background:#f0f4ff}
.status-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.status-won{background:#e8f8ef;color:#1e8449}.status-lost{background:#fde8e8;color:#c0392b}.status-open{background:#e8f0fe;color:#2471a3}
.group-section{background:#fff;border-radius:8px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.group-header{display:flex;justify-content:space-between;padding:12px 16px;cursor:pointer;background:#f8f9fa;border-bottom:1px solid #eee;align-items:center}
.group-header:hover{background:#eef1f5}
.group-name{font-weight:600}.group-stats{font-size:12px;color:#666}
.group-body{display:none;padding:8px}
.group-body.open{display:block}
a{color:#317ae2;text-decoration:none}a:hover{text-decoration:underline}
.sort-icon{font-size:10px;margin-left:4px;color:#aaa}
#refresh-panel{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
#refresh-panel h2{font-size:15px;margin-bottom:12px;color:#555}
.refresh-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.refresh-row input[type="date"]{padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px}
.refresh-row label{font-size:13px;color:#666}
.status-text{font-size:13px;color:#27ae60;margin-left:8px}
.chart-row{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.chart-box{flex:1;min-width:400px;background:#fff;border-radius:8px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
</style>
