<style>
:root{
  --primary:#3b82f6;--primary-dark:#2563eb;--primary-light:#eff6ff;
  --success:#10b981;--success-light:#ecfdf5;
  --danger:#ef4444;--danger-light:#fef2f2;
  --warning:#f59e0b;--warning-light:#fffbeb;
  --purple:#8b5cf6;--purple-light:#f5f3ff;
  --teal:#14b8a6;--orange:#f97316;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;
  --gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;
  --gray-800:#1f2937;--gray-900:#111827;
  --radius:8px;--radius-lg:12px;--radius-sm:6px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px -2px rgba(0,0,0,.08),0 2px 4px -2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 25px -5px rgba(0,0,0,.08),0 8px 10px -6px rgba(0,0,0,.04);
  --transition:all .15s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;background:#f8fafc;color:var(--gray-800);font-size:14px;min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#app{max-width:1600px;margin:0 auto;padding:20px}
.layout{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.main{min-width:0}
.report-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:0 4px;gap:16px;flex-wrap:wrap}
.report-header-title{font-size:20px;font-weight:700;color:var(--gray-900);letter-spacing:-.02em;line-height:1.2}
.report-header-desc{font-size:12px;color:var(--gray-500);margin-top:3px}
.report-header-actions{display:flex;gap:8px;align-items:center}
.report-header-meta{font-size:11px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:4px 10px;background:var(--gray-100);border-radius:12px}
.sidebar{position:sticky;top:20px;background:#fff;border-radius:var(--radius-lg);padding:14px 0;box-shadow:var(--shadow);border:1px solid var(--gray-100);max-height:calc(100vh - 120px);display:flex;flex-direction:column}
.sidebar-head{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px;border-bottom:1px solid var(--gray-100)}
.sidebar-head h2{font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;margin:0}
.icon-btn{width:28px;height:28px;border:1px solid var(--gray-200);background:#fff;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition);padding:0}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.plus-icon{width:12px;height:12px;position:relative;display:inline-block}
.plus-icon::before,.plus-icon::after{content:'';position:absolute;background:currentColor}
.plus-icon::before{left:5px;top:0;width:2px;height:12px;border-radius:1px}
.plus-icon::after{left:0;top:5px;width:12px;height:2px;border-radius:1px}
.edit-icon,.trash-icon{width:12px;height:12px;display:inline-block;background:currentColor;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;-webkit-mask-size:contain;mask-repeat:no-repeat;mask-position:center;mask-size:contain}
.edit-icon{-webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7'/><path d='M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z'/></svg>");mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7'/><path d='M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z'/></svg>")}
.trash-icon{-webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><polyline points='3 6 5 6 21 6'/><path d='M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6'/><path d='M10 11v6'/><path d='M14 11v6'/><path d='M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2'/></svg>");mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><polyline points='3 6 5 6 21 6'/><path d='M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6'/><path d='M10 11v6'/><path d='M14 11v6'/><path d='M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2'/></svg>")}
.sidebar-search{padding:10px 12px 6px}
.sidebar-search input{width:100%;padding:7px 10px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:12px;font-family:inherit;background:var(--gray-50);transition:var(--transition)}
.sidebar-search input:focus{outline:none;border-color:var(--primary);background:#fff}
.preset-list{flex:1;overflow-y:auto;padding:4px 6px 8px}
.preset-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);position:relative;margin-bottom:1px}
.preset-item:hover{background:var(--gray-50)}
.preset-item.active{background:var(--primary-light);color:var(--primary-dark)}
.preset-item .preset-icon{width:28px;height:28px;border-radius:6px;background:var(--gray-200);color:var(--gray-700);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:-.02em}
.preset-item.active .preset-icon{background:var(--primary);color:#fff}
.preset-item .preset-meta{flex:1;min-width:0;overflow:hidden}
.preset-item .preset-name{font-size:13px;font-weight:500;color:var(--gray-800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset-item.active .preset-name{color:var(--primary-dark);font-weight:600}
.preset-item .preset-desc{font-size:11px;color:var(--gray-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.preset-item .preset-actions{display:none;gap:2px;flex-shrink:0}
.preset-item:hover .preset-actions{display:flex}
.preset-item .preset-actions button{width:22px;height:22px;padding:0;border:none;background:transparent;border-radius:4px;cursor:pointer;color:var(--gray-500);display:flex;align-items:center;justify-content:center;font-size:12px}
.preset-item .preset-actions button:hover{background:var(--gray-200);color:var(--gray-800)}
.preset-item.clear-item{color:var(--gray-500)}
.preset-item.clear-item .preset-name{font-style:italic}
.preset-empty{padding:20px 14px;text-align:center;color:var(--gray-400);font-size:12px}
@media (max-width:960px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}}

/* ===== Header ===== */
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
header h1{font-size:22px;font-weight:700;color:var(--gray-900);letter-spacing:-.02em}
.tabs{display:flex;gap:2px;background:var(--gray-100);padding:3px;border-radius:8px}
.tab{padding:7px 16px;background:transparent;border:none;border-radius:6px;font-size:13px;font-weight:500;color:var(--gray-600);cursor:pointer;font-family:inherit;transition:var(--transition)}
.tab:hover{color:var(--gray-800)}
.tab.active{background:#fff;color:var(--gray-900);box-shadow:var(--shadow-sm)}

/* ===== AI Panel ===== */
.ai-history{min-height:120px;max-height:480px;overflow-y:auto;margin-bottom:12px;padding:14px;background:var(--gray-50);border-radius:var(--radius);border:1px solid var(--gray-100);display:none}
.ai-history.has-content{display:block}
.ai-msg{margin-bottom:12px;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5}
.ai-msg.user{background:var(--primary-light);border-left:3px solid var(--primary);color:var(--gray-800)}
.ai-msg.ai{background:#fff;border-left:3px solid var(--success);color:var(--gray-700)}
.ai-msg.error{background:var(--danger-light);border-left:3px solid var(--danger);color:#991b1b}
.ai-msg .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-500);margin-bottom:4px}
.ai-msg pre{font-size:11px;background:var(--gray-50);padding:8px;border-radius:6px;margin-top:6px;max-height:160px;overflow:auto;white-space:pre-wrap}
.ai-msg .filter-chip{display:inline-block;padding:3px 9px;background:#fff;border:1px solid var(--gray-200);border-radius:12px;font-size:11px;color:var(--gray-700);margin:2px 3px 2px 0}
.ai-input-row{display:flex;gap:10px;align-items:stretch}
.ai-input-row textarea{flex:1;padding:12px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;resize:vertical;min-height:72px;color:var(--gray-800);transition:var(--transition)}
.ai-input-row textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.ai-actions{display:flex;flex-direction:column;gap:8px}
.mic-btn{width:44px;height:44px;padding:0;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;position:relative}
.mic-btn.listening{border-color:var(--danger);background:var(--danger-light)}
.mic-btn.listening .mic-icon{background:var(--danger)}
.mic-btn.listening::after{content:'';position:absolute;inset:-4px;border:2px solid var(--danger);border-radius:10px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0;transform:scale(1.15)}}
.mic-icon{width:14px;height:20px;background:var(--gray-500);border-radius:7px;position:relative;display:inline-block}
.mic-icon::before{content:'';position:absolute;left:50%;bottom:-6px;width:2px;height:4px;background:var(--gray-500);transform:translateX(-50%)}
.mic-icon::after{content:'';position:absolute;left:50%;bottom:-9px;width:10px;height:2px;background:var(--gray-500);transform:translateX(-50%);border-radius:1px}
.mic-btn:disabled{opacity:.4;cursor:not-allowed}
.ai-spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--gray-600);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 4px}
.form-input{width:100%;padding:8px 10px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;color:var(--gray-800);transition:var(--transition)}
.form-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--gray-900);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:2000;display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .2s ease,transform .2s ease}
#toast.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
#toast.success{background:var(--success);color:#fff}
#toast.error{background:var(--danger);color:#fff}
#toast .toast-check{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
#toast .toast-check::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px}

/* ===== Panels ===== */
.panel{background:#fff;border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow-sm);margin-bottom:16px;border:1px solid var(--gray-100)}
.panel h2{font-size:12px;font-weight:700;color:var(--gray-500);margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em}
.panel-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;margin-bottom:14px}
.panel-head h2{margin-bottom:0}
.panel-head:hover h2{color:var(--gray-700)}
.panel-chevron{width:10px;height:10px;border-right:2px solid var(--gray-400);border-bottom:2px solid var(--gray-400);transform:rotate(45deg);transition:transform .15s ease;margin-right:4px;margin-bottom:4px}
#filter-panel.collapsed .panel-head{margin-bottom:0}
#filter-panel.collapsed #filter-body{display:none}
#filter-panel.collapsed .panel-chevron{transform:rotate(-45deg);margin-bottom:0;margin-top:4px}

/* ===== Sub-tabs (report view switch) ===== */
.sub-tabs{display:inline-flex;gap:2px;background:var(--gray-100);padding:3px;border-radius:8px;margin-bottom:14px}
.sub-tab{padding:7px 16px;background:transparent;border:none;border-radius:6px;font-size:13px;font-weight:500;color:var(--gray-600);cursor:pointer;font-family:inherit;transition:var(--transition)}
.sub-tab:hover{color:var(--gray-800)}
.sub-tab.active{background:#fff;color:var(--gray-900);box-shadow:var(--shadow-sm)}

/* ===== Preset cards ===== */
#presets-panel{margin-bottom:16px}
.preset-cards{display:flex;gap:10px;flex-wrap:wrap}
.preset-card{background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--radius);padding:12px 16px;cursor:pointer;transition:var(--transition);min-width:220px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.preset-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.preset-card.active{border-color:var(--primary);background:var(--primary-light);box-shadow:var(--shadow-md)}
.preset-card .preset-icon{width:36px;height:36px;border-radius:8px;background:var(--primary);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:-.02em}
.preset-card .preset-name{font-weight:600;font-size:13px;color:var(--gray-800)}
.preset-card .preset-desc{font-size:11px;color:var(--gray-500);margin-top:2px}
.preset-card.clear{min-width:auto;padding:12px 14px;color:var(--gray-500)}
.preset-card.clear:hover{border-color:var(--gray-400);color:var(--gray-700)}

/* ===== Refresh panel ===== */
.refresh-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.refresh-row label{font-size:13px;color:var(--gray-600);font-weight:500}
.date-input{padding:8px 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;color:var(--gray-800);background:#fff;transition:var(--transition);font-family:inherit}
.date-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.date-input:hover{border-color:var(--gray-300)}

/* ===== Filters ===== */
#filter-rows{display:flex;flex-direction:column;gap:8px}
.filter-row{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:var(--gray-50);border-radius:var(--radius);border:1px solid transparent;flex-wrap:wrap;transition:var(--transition)}
.filter-row:hover{border-color:var(--gray-200);background:#fff}
.field-select,.operator-select{padding:8px 10px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;background:#fff;color:var(--gray-800);font-family:inherit;transition:var(--transition);min-height:36px}
.field-select:focus,.operator-select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.field-select{width:220px}.operator-select{width:150px}
.value-container{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.value-container input,.value-container select,.value-container .search-input{padding:8px 10px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;background:#fff;width:100%;font-family:inherit;transition:var(--transition);min-height:36px}
.value-container input:focus,.value-container select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.date-range-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.date-range-row input[type="date"]{width:150px;flex:0 0 auto}
.date-range-row .ssel.ssel-date{width:200px;flex:0 0 auto}
.date-range-row span{color:var(--gray-400);font-size:12px}

/* Pill selectors for status etc. */
.pill-group{display:flex;gap:4px;flex-wrap:wrap}
.pill{padding:6px 12px;border:1.5px solid var(--gray-200);background:#fff;border-radius:16px;font-size:12px;cursor:pointer;color:var(--gray-700);transition:var(--transition);white-space:nowrap;font-family:inherit}
.pill:hover{border-color:var(--gray-400)}
.pill.active{border-color:var(--primary);background:var(--primary);color:#fff;font-weight:500}
.pill.active.won{border-color:var(--success);background:var(--success)}
.pill.active.lost{border-color:var(--danger);background:var(--danger)}
.pill.active.open{border-color:var(--primary);background:var(--primary)}

/* Searchable dropdown */
.ssel{position:relative}
.ssel-input{cursor:pointer;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1.5L6 6.5L11 1.5' stroke='%239ca3af' stroke-width='1.5' stroke-linecap='round'/></svg>") no-repeat right 12px center;padding-right:32px!important}
.ssel-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);z-index:20;max-height:280px;overflow:hidden;display:none;flex-direction:column}
.ssel-drop.open{display:flex}
.ssel-search{padding:8px;border-bottom:1px solid var(--gray-100)}
.ssel-search input{padding:6px 10px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:12px;width:100%;font-family:inherit}
.ssel-search input:focus{outline:none;border-color:var(--primary)}
.ssel-options{overflow-y:auto;padding:4px 0;max-height:240px}
.ssel-optgroup{padding:6px 12px;font-size:11px;text-transform:uppercase;color:var(--gray-400);font-weight:600;letter-spacing:.05em;background:var(--gray-50)}
.ssel-option{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--gray-800);display:flex;align-items:center;gap:8px}
.ssel-option:hover{background:var(--primary-light);color:var(--primary-dark)}
.ssel-option.selected{background:var(--primary-light);color:var(--primary-dark);font-weight:500}
.ssel-check{width:14px;height:14px;display:inline-block;border:1.5px solid var(--gray-300);border-radius:3px;background:#fff;position:relative;flex-shrink:0;transition:var(--transition)}
.ssel-check.on{background:var(--primary);border-color:var(--primary)}
.ssel-check.on::after{content:'';position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ssel-option{align-items:center}
.ssel-multi .ssel-input{cursor:pointer}
.ssel-empty{padding:16px;text-align:center;color:var(--gray-400);font-size:12px}

.btn-remove{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-500);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:var(--transition);flex-shrink:0;margin-top:2px}
.btn-remove:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-light)}

.filter-actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px}
.right-actions{display:flex;gap:8px;align-items:center}
#btn-add{background:#fff;border:1.5px dashed var(--gray-300);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;color:var(--gray-600);font-size:13px;font-weight:500;transition:var(--transition);font-family:inherit}
#btn-add:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
#group-by{padding:8px 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;background:#fff;color:var(--gray-800);font-family:inherit;cursor:pointer}

/* ===== Buttons ===== */
.primary{background:var(--primary);color:#fff;border:none;padding:9px 18px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:600;transition:var(--transition);font-family:inherit;letter-spacing:-.01em}
.primary:hover{background:var(--primary-dark)}
.primary:active{transform:translateY(.5px)}
.primary:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:#fff;color:var(--gray-700);border:1.5px solid var(--gray-200);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;transition:var(--transition)}
.ghost:hover{border-color:var(--gray-400);background:var(--gray-50)}

/* ===== Loading & Errors ===== */
#loading{text-align:center;padding:48px;color:var(--gray-500)}
.spinner{width:36px;height:36px;border:3px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
#error-bar{background:var(--danger-light);border-left:3px solid var(--danger);border-radius:var(--radius);padding:12px 16px;color:#991b1b;margin-bottom:16px;font-size:13px;font-weight:500}

/* ===== KPI cards ===== */
#summary-cards,#kpi-extra-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}

.card.won::before{background:var(--success)}
.card.lost::before{background:var(--danger)}
.card.open::before{background:var(--primary)}

.card.kpi-forecast::before{background:var(--orange)}

.card .num-multi{display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.card .num-multi .curr-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card .num-multi .curr-amt{font-size:16px;font-weight:700;color:var(--gray-900);letter-spacing:-.01em;line-height:1.25}
.card .num-multi .curr-sym{font-size:12px;font-weight:600;color:var(--gray-500)}
.card .num-multi .curr-empty{font-size:26px;font-weight:700;color:var(--gray-300)}
.card.won .num-multi .curr-amt{color:var(--success)}
.card.lost .num-multi .curr-amt{color:var(--danger)}
.card.open .num-multi .curr-amt{color:var(--primary)}
.card.kpi-pipeline .num-multi .curr-amt{color:var(--purple)}
.card.kpi-avg .num-multi .curr-amt{color:var(--teal)}
.card.kpi-forecast .num-multi .curr-amt{color:var(--orange)}
.card.won .num{color:var(--success)}.card.lost .num{color:var(--danger)}.card.open .num{color:var(--primary)}
.card.kpi-pipeline .num{color:var(--purple)}.card.kpi-avg .num{color:var(--teal)}.card.kpi-forecast .num{color:var(--orange)}
